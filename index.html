<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Air Bersih</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. KONFIGURASI FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCGxO7B7PMPv3YhSNVcm-CpWUcxVPIA4bM",
            authDomain: "hipab-srikoyo-data.firebaseapp.com",
            projectId: "hipab-srikoyo-data",
            storageBucket: "hipab-srikoyo-data.firebasestorage.app",
            messagingSenderId: "741286764093",
            appId: "1:741286764093:web:b355072e65eca80ea91454"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const DB_PUSAT = db.collection('srikoyo_database').doc('main_data');
        const { useState, useEffect } = React;

        // --- 2. FUNGSI UTILITY UMUM ---
        const formatRp = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);
        const curYMD = () => new Date().toISOString().slice(0, 10);
        const formatBlnThn = (iso) => {
            if(!iso) return '';
            const [y, m] = iso.split('-');
            const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            return `${bln[parseInt(m)-1]} ${y}`;
        };
        const getSisa = (t) => t ? Math.max(0, t.total - (t.terbayar || 0)) : 0;
        const getTunggakan = (tgs, id, per) => tgs.filter(t => t.idPelanggan === id && t.periode < per).reduce((s, t) => s + getSisa(t), 0);
        const checkKritis = (tgs, id, bBulan, bNominal) => {
            const utang = tgs.filter(t => t.idPelanggan === id && getSisa(t) > 0);
            return (utang.length >= bBulan || utang.reduce((s, t) => s + getSisa(t), 0) >= bNominal);
        };
        const checkBocor = (tgs, id, pakai, per) => {
            const tl = tgs.filter(t => t.idPelanggan === id && t.periode < per).sort((a,b) => b.periode.localeCompare(a.periode)).slice(0,3);
            if(tl.length === 0) return false;
            const avg = tl.reduce((s,t) => s + Math.max(0, t.meterAkhir - t.meterAwal), 0) / tl.length;
            return (avg > 0 && pakai > (avg * 2.5) && pakai > 10);
        };

        const copyText = (txt) => {
            const el = document.createElement("textarea"); el.value = txt; document.body.appendChild(el); el.select();
            try { document.execCommand('copy'); return true; } catch(err) { return false; } finally { document.body.removeChild(el); }
        };

        // --- 3. CETAK DOKUMEN ---
        const printDoc = (html, isStruk) => {
            const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0;'; document.body.appendChild(f);
            const d = f.contentWindow.document;
            const sty = isStruk 
                ? `@page { size: 58mm auto; margin:0; } body { width: 54mm; font-family:sans-serif; font-size:11px; margin:2mm; line-height:1.4; color:#000; } hr{border:0.5px dashed #000; margin:6px 0;} .tc{text-align:center} .tr{text-align:right} .b{font-weight:bold} table{width:100%;font-size:11px}`
                : `@page { size: A4; margin:15mm; } body { font-family:sans-serif; font-size:12px; color:#000; } table{width:100%;border-collapse:collapse;margin-top:15px} th,td{border:1px solid #333;padding:8px;text-align:left} th{background:#f3f4f6;text-align:center} .tc{text-align:center} .tr{text-align:right} .header{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:20px;text-align:center}`;
            d.open(); d.write(`<html><head><style>${sty}</style></head><body>${html}</body></html>`); d.close();
            f.onload = () => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(()=>document.body.removeChild(f), 2000); };
        };

        // --- 4. KOMPONEN UI DASAR ---
        const Icon = ({name, cl}) => <i className={`fas fa-${name} ${cl || ''}`}></i>;
        const NavBtn = ({ic, lb, act, onClick}) => <button onClick={onClick} className={`flex items-center w-full px-4 py-3 text-sm font-bold rounded-lg transition-all ${act?'bg-blue-800 text-white shadow-inner':'text-blue-200 hover:bg-blue-800'}`}><Icon name={ic} cl="w-6 text-center text-lg mr-2"/>{lb}</button>;
        
        // --- 5. FITUR FILTER WILAYAH ---
        const useWilayah = (data, isAdmin, cUser) => {
            const uWil = cUser.wilayah ? cUser.wilayah.split(',').map(w=>w.trim()).filter(Boolean) : [];
            const isLock = !isAdmin && uWil.length > 0;
            const [fw, setFw] = useState(isLock ? uWil[0] || 'Semua' : 'Semua');
            const drp = isLock ? ['Semua', ...uWil] : ['Semua', ...new Set(data.map(p=>p.wilayah).filter(Boolean))];
            const isMatch = (w) => isLock ? (fw==='Semua' ? uWil.includes(w) : w===fw) : (fw==='Semua' || w===fw);
            return { fw, setFw, drp, isLock, isMatch };
        };

        // --- 6. LAYAR LOGIN ---
        function Login({ users, set, onLogin, showToast }) {
            const [u, setU] = useState(''); const [p, setP] = useState('');
            const sub = (e) => {
                e.preventDefault();
                if(users.length===0 && u==='admin' && p==='admin123') return onLogin({username:'admin', role:'Admin', wilayah:''});
                const v = users.find(x => x.username===u && x.password===p);
                if(v) onLogin({...v, role:v.role||'Admin', wilayah:v.wilayah||''}); else alert('Gagal Login!');
            };
            return (
                <div className="flex items-center justify-center min-h-[100dvh] bg-blue-900 px-4">
                    <form onSubmit={sub} className="bg-white p-8 rounded-2xl w-full max-w-md shadow-2xl text-center">
                        <div className="bg-blue-100 w-24 h-24 rounded-full mx-auto mb-4 flex items-center justify-center text-blue-600 text-4xl">{set.logo&&set.logo.startsWith('data')?<img src={set.logo} className="w-full h-full object-contain p-2"/>:<Icon name="tint"/>}</div>
                        <h2 className="text-2xl font-bold">{set.appName}</h2><p className="text-blue-600 font-bold mt-1 mb-6">{set.appSubtitle}</p>
                        <input value={u} onChange={e=>setU(e.target.value)} placeholder="Username" className="w-full p-3 border rounded-lg mb-4 outline-none focus:border-blue-500" required/>
                        <input value={p} onChange={e=>setP(e.target.value)} type="password" placeholder="Password" className="w-full p-3 border rounded-lg mb-6 outline-none focus:border-blue-500" required/>
                        <button className="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">Masuk</button>
                    </form>
                </div>
            );
        }

        // --- 7. DASHBOARD ---
        function Dash({ pel, tag, peng, kel, adm, cUser, set }) {
            const wf = useWilayah(pel, adm, cUser); const pMatch = pel.filter(p=>wf.isMatch(p.wilayah)); const pId = new Set(pMatch.map(p=>p.id));
            const tgs = tag.filter(t=>pId.has(t.idPelanggan)); const tBln = tgs.filter(t=>t.periode===curYMD().slice(0,7));
            const inBln = tBln.reduce((s,t)=>s+(t.terbayar||0),0), outBln = tBln.reduce((s,t)=>s+getSisa(t),0);
            const bBln = set.batasBulanKritis||3, bNom = set.batasNominalKritis||350000;
            const kr = Array.from(pId).filter(id=>checkKritis(tgs,id,bBln,bNom)).length;
            const kP = kel?kel.filter(k=>k.status!=='Selesai'&&pId.has(k.idPelanggan)).length:0;
            const pgB = (adm&&wf.fw==='Semua')?peng.filter(p=>p.tanggal.startsWith(curYMD().slice(0,7))).reduce((s,p)=>s+p.nominal,0):0;

            const Box = ({t, v, c, i}) => <div className="bg-white p-5 rounded-xl border flex justify-between items-center"><div><p className="text-sm text-gray-500">{t}</p><p className={`text-xl font-bold text-${c}-600`}>{v}</p></div><div className={`p-3 bg-${c}-50 rounded-full text-${c}-500 text-2xl`}><Icon name={i}/></div></div>;
            
            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center border-b pb-2"><h2 className="text-2xl font-bold">Dashboard</h2><select value={wf.fw} onChange={e=>wf.setFw(e.target.value)} className="p-2 border rounded-lg bg-white" disabled={wf.isLock&&wf.drp.length<2}>{wf.drp.map(w=><option key={w}>{w}</option>)}</select></div>
                    <div className="bg-red-50 border-l-4 border-red-600 p-4 rounded-lg flex justify-between"><div className="text-red-800 font-bold"><Icon name="exclamation-triangle" cl="mr-2"/>STATUS KRITIS<div className="text-xs font-normal">Tunggakan &ge;{bBln} bln / &ge;{formatRp(bNom)}</div></div><div className="text-3xl font-black text-red-600 animate-pulse">{kr}</div></div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Box t="Masuk Bln Ini" v={formatRp(inBln)} c="green" i="money-bill"/> <Box t="Sisa Bln Ini" v={formatRp(outBln)} c="yellow" i="exclamation"/>
                        <Box t="Pelanggan Aktif" v={pMatch.filter(p=>p.status==='Aktif').length} c="blue" i="users"/> <Box t="Keluhan Baru" v={kP} c="orange" i="tools"/>
                        {(adm&&wf.fw==='Semua') && <><Box t="Pengeluaran Bln Ini" v={formatRp(pgB)} c="red" i="minus-circle"/> <Box t="Laba Bersih Bln Ini" v={formatRp(inBln-pgB)} c="blue" i="chart-line"/></>}
                    </div>
                </div>
            );
        }

        // --- 8. PELANGGAN ---
        function PelMgr({ data, toast, adm, cUser }) {
            const wf = useWilayah(data, adm, cUser); const [m, setM] = useState(false); const [eId, setEId] = useState(null);
            const [f, setF] = useState({no:'', nama:'', wil:'', rt:'', rw:'', st:'Aktif', hp:''}); const [src, setSrc] = useState('');
            const fd = data.filter(p=>wf.isMatch(p.wilayah)&&(p.nama.toLowerCase().includes(src.toLowerCase())||p.noPelanggan.includes(src)));
            
            const open = (p=null) => { if(p){setEId(p.id);setF({no:p.noPelanggan, nama:p.nama, wil:p.wilayah||'', rt:p.rt, rw:p.rw, st:p.status, hp:p.noHp});}else{setEId(null);setF({no:'', nama:'', wil:wf.isLock?wf.drp[1]||'':'', rt:'', rw:'', st:'Aktif', hp:''});} setM(true); };
            const save = async (e) => { e.preventDefault(); const pl={noPelanggan:f.no, nama:f.nama, wilayah:f.wil, rt:f.rt, rw:f.rw, status:f.st, noHp:f.hp}; try{if(eId)await DB_PUSAT.collection('pelanggan').doc(eId).update(pl);else await DB_PUSAT.collection('pelanggan').add(pl);setM(false);toast('Tersimpan!');}catch(e){alert(e.message);} };
            const del = async (id) => { if(adm&&confirm('Hapus?')){await DB_PUSAT.collection('pelanggan').doc(id).delete();toast('Dihapus!');} };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center border-b pb-2"><h2 className="text-xl font-bold">Data Pelanggan</h2>{adm&&<button onClick={()=>open()} className="bg-blue-600 text-white px-3 py-1 rounded">Tambah</button>}</div>
                    <div className="flex gap-2"><select value={wf.fw} onChange={e=>wf.setFw(e.target.value)} className="border p-2 rounded w-1/3" disabled={wf.isLock&&wf.drp.length<2}>{wf.drp.map(w=><option key={w}>{w}</option>)}</select><input placeholder="Cari..." value={src} onChange={e=>setSrc(e.target.value)} className="border p-2 rounded flex-1"/></div>
                    <div className="bg-white border rounded-xl overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b"><tr><th className="p-3">No</th><th className="p-3">Nama</th><th className="p-3">Wilayah</th><th className="p-3">Status</th><th className="p-3">Aksi</th></tr></thead><tbody className="divide-y">{fd.map(p=><tr key={p.id}><td className="p-3">{p.noPelanggan}</td><td className="p-3 font-bold">{p.nama}</td><td className="p-3">{p.wilayah||'-'}</td><td className="p-3">{p.status}</td><td className="p-3"><button onClick={()=>open(p)} className="text-blue-600 mr-3"><Icon name="edit"/></button>{adm&&<button onClick={()=>del(p.id)} className="text-red-600"><Icon name="trash"/></button>}</td></tr>)}</tbody></table></div>
                    {m && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={save} className="bg-white p-6 rounded-xl w-full max-w-sm"><h3 className="font-bold text-lg mb-4">Form Pelanggan</h3><input value={f.no} onChange={e=>setF({...f, no:e.target.value})} placeholder="No Pelanggan" className="w-full border p-2 mb-2 rounded" required/><input value={f.nama} onChange={e=>setF({...f, nama:e.target.value})} placeholder="Nama" className="w-full border p-2 mb-2 rounded" required/><input value={f.wil} onChange={e=>setF({...f, wil:e.target.value})} placeholder="Wilayah" className="w-full border p-2 mb-2 rounded" disabled={wf.isLock}/><div className="flex gap-2 mb-2"><input value={f.rt} onChange={e=>setF({...f, rt:e.target.value})} placeholder="RT" className="w-1/2 border p-2 rounded"/><input value={f.rw} onChange={e=>setF({...f, rw:e.target.value})} placeholder="RW" className="w-1/2 border p-2 rounded"/></div><select value={f.st} onChange={e=>setF({...f, st:e.target.value})} className="w-full border p-2 mb-4 rounded"><option>Aktif</option><option>Tidak Aktif</option></select><div className="flex justify-end gap-2"><button type="button" onClick={()=>setM(false)} className="px-4 py-2 border rounded">Batal</button><button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded">Simpan</button></div></form></div>}
                </div>
            );
        }

        // --- 9. TAGIHAN ---
        function TagMgr({ pel, tag, set, toast, adm, cUser }) {
            const wf = useWilayah(pel, adm, cUser); const [per, setPer] = useState(curYMD().slice(0,7)); const [src, setSrc] = useState('');
            const [fm, setFm] = useState(false); const [fInp, setFInp] = useState({}); const [sv, setSv] = useState(false);
            const [m, setM] = useState(false); const [sP, setSP] = useState(null); const [eT, setET] = useState(null); const [mA, setMA] = useState(''); const [mAk, setMAk] = useState('');
            const [pM, setPM] = useState(false); const [pN, setPN] = useState('');

            const bb = set.batasBulanKritis||3, bn = set.batasNominalKritis||350000, kb = Math.max(0, Number(mAk)-Number(mA)), tot = (kb*set.tarif)+set.beban;
            const fp = pel.filter(p=>p.status==='Aktif'||tag.some(t=>t.idPelanggan===p.id&&t.periode===per)).filter(p=>wf.isMatch(p.wilayah)).filter(p=>p.nama.toLowerCase().includes(src.toLowerCase()));

            const getPrv = (id) => { const [y,m]=per.split('-'); let pm=parseInt(m)-1, py=parseInt(y); if(pm===0){pm=12;py-=1;} const pt=tag.find(x=>x.idPelanggan===id&&x.periode===`${py}-${pm.toString().padStart(2,'0')}`); return pt?pt.meterAkhir:0; };
            
            const openT = (p) => { const t=tag.find(x=>x.idPelanggan===p.id&&x.periode===per); setSP(p); setET(t); if(t){setMA(t.meterAwal);setMAk(t.meterAkhir);}else{setMA(getPrv(p.id));setMAk('');} setM(true); };
            const svT = async (e) => { e.preventDefault(); const pl={idPelanggan:sP.id, periode:per, meterAwal:Number(mA), meterAkhir:Number(mAk), total:tot, terbayar:eT?eT.terbayar||0:0, status:eT?eT.status:'Belum Terbayar'}; try{if(eT)await DB_PUSAT.collection('tagihan').doc(eT.id).update(pl);else await DB_PUSAT.collection('tagihan').add(pl);setM(false);toast('Tersimpan!');}catch(e){alert(e.message);} };
            const delT = async (id) => { if(adm&&confirm('Hapus Tagihan?')){await DB_PUSAT.collection('tagihan').doc(id).delete();setM(false);toast('Dihapus!');} };

            const svMas = async () => { setSv(true); let c=0; try{await Promise.all(fp.map(async p=>{ const v=fInp[p.id]; if(v!==undefined&&v!==''){ const mE=Number(v), t=tag.find(x=>x.idPelanggan===p.id&&x.periode===per), mS=t?t.meterAwal:getPrv(p.id), th=(Math.max(0,mE-mS)*set.tarif)+set.beban; if(t){if(t.meterAkhir!==mE){await DB_PUSAT.collection('tagihan').doc(t.id).update({meterAkhir:mE, total:th, meterAwal:mS});c++;}}else{await DB_PUSAT.collection('tagihan').add({idPelanggan:p.id, periode:per, meterAwal:mS, meterAkhir:mE, total:th, terbayar:0, status:'Belum Terbayar'});c++;} } })); if(c>0)toast(`${c} Tersimpan!`); setFInp({}); setFm(false); }catch(e){alert(e.message);} setSv(false); };

            const openP = (p) => { setSP(p); setPN(''); setPM(true); };
            const svP = async (e) => {
                e.preventDefault(); let u=Number(pN); const as=u; if(u<0)return;
                try {
                    const cT=tag.find(t=>t.idPelanggan===sP.id&&t.periode===per), ul=tag.filter(t=>t.idPelanggan===sP.id&&getSisa(t)>0&&t.periode!==per).sort((a,b)=>a.periode.localeCompare(b.periode));
                    const tHut = (cT?getSisa(cT):0)+ul.reduce((s,t)=>s+getSisa(t),0), kmb = Math.max(0, as-tHut), tId = cT?cT.id:(ul.length?ul[ul.length-1].id:null);
                    const pay = async (t) => { const s=getSisa(t), b=Math.min(u,s); await DB_PUSAT.collection('tagihan').doc(t.id).update({terbayar:(t.terbayar||0)+b, status:((t.terbayar||0)+b)>=t.total?'Terbayar':'Belum Terbayar', petugasPenagih:cUser.username, ...(t.id===tId&&{uangDiserahkan:as, kembalian:kmb})}); u-=b; };
                    if(cT&&u>0){ if(getSisa(cT)>0) await pay(cT); else if(cT.id===tId) await DB_PUSAT.collection('tagihan').doc(cT.id).update({uangDiserahkan:as, kembalian:kmb, petugasPenagih:cUser.username}); }
                    if(u>0) for(let t of ul){ if(u<=0)break; await pay(t); } setPM(false); toast('Pembayaran Sukses!');
                } catch(err){alert(err.message);}
            };

            const doCtk = (p, t, wa) => {
                const tgL=getTunggakan(tag, p.id, t.periode), ht=tag.filter(x=>x.idPelanggan===p.id).reduce((s,x)=>s+getSisa(x),0), pet=t.petugasPenagih||cUser.username;
                if(wa){ copyText(`Yth. ${p.nama},\nTagihan HIPAB ${formatBulanTahunLengkap(t.periode)}\n\nM.Awal: ${t.meterAwal}\nM.Akhir: ${t.meterAkhir}\nTotal: ${formatRp(t.total+tgL)}\nStatus: ${ht<=0?'LUNAS':'BELUM LUNAS'}`); toast('Disalin!'); return; }
                const h = `<div class="tc"><div class="title">${set.appName}</div><div>Srikoyo</div></div><hr/><table><tr><td>NO</td><td>: ${p.noPelanggan}</td></tr><tr><td>NAMA</td><td>: ${p.nama}</td></tr><tr><td>PERIODE</td><td>: ${t.periode}</td></tr></table><hr/><table><tr><td>M.AWAL</td><td class="tr">${t.meterAwal}</td></tr><tr><td>M.AKHIR</td><td class="tr">${t.meterAkhir}</td></tr></table><hr/><table><tr><td>TAGIHAN</td><td class="tr">${formatRp(t.total)}</td></tr><tr><td>TUNGGAKAN</td><td class="tr">${formatRp(tgL)}</td></tr><tr class="b"><td>TOTAL</td><td class="tr">${formatRp(t.total+tgL)}</td></tr></table><hr/><table><tr class="b" style="color:red"><td>SISA HUTANG</td><td class="tr">${formatRp(ht)}</td></tr></table><hr/><div class="tc"><div class="b">${ht<=0?'LUNAS':'BELUM LUNAS'}</div><div>PTGS: ${pet}</div></div>`;
                printDoc(h, window.innerWidth<768); toast('Mencetak...');
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center border-b pb-2"><h2 className="text-xl font-bold">Tagihan</h2><button onClick={()=>setFm(!fm)} className="bg-indigo-600 text-white px-3 py-1 rounded text-sm">{fm?'Tutup Keliling':'Mode Keliling'}</button></div>
                    <div className="flex gap-2 mb-2"><select value={wf.fw} onChange={e=>wf.setFw(e.target.value)} className="border p-2 rounded flex-1" disabled={wf.isLock}>{wf.drp.map(w=><option key={w}>{w}</option>)}</select><input type="month" value={per} onChange={e=>setPer(e.target.value)} className="border p-2 rounded flex-1"/><input placeholder="Cari..." value={src} onChange={e=>setSrc(e.target.value)} className="border p-2 rounded flex-1"/></div>
                    
                    {fm ? (
                        <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-200"><div className="flex justify-between mb-4"><h3 className="font-bold">Mode Cepat</h3><button onClick={svMas} className="bg-green-600 text-white px-4 py-1 rounded">{sv?'Menyimpan...':'Simpan Semua'}</button></div><div className="space-y-2">{fp.map(p=>{const t=tag.find(x=>x.idPelanggan===p.id&&x.periode===per), mS=t?t.meterAwal:getPrv(p.id), v=fInp[p.id]!==undefined?fInp[p.id]:(t?t.meterAkhir:''), b=v!==''?checkBocor(tag,p.id,Math.max(0,Number(v)-mS),per):false; return (<div key={p.id} className="bg-white p-3 rounded flex justify-between items-center border"><div><div className="font-bold text-sm truncate">{p.nama}</div><div className="text-xs text-gray-500">Aw: {mS}</div></div><div className="w-1/2"><input type="number" value={v} onChange={e=>setFInp({...fInp,[p.id]:e.target.value})} className="border-2 p-1 w-full rounded text-center font-bold" placeholder="Akhir"/>{b&&<div className="text-[10px] text-red-600 text-center font-bold">⚠️ Bocor</div>}</div></div>)})}</div></div>
                    ) : (
                        <div className="space-y-3">{fp.map(p=>{ const t=tag.find(x=>x.idPelanggan===p.id&&x.periode===per), ht=tag.filter(x=>x.idPelanggan===p.id).reduce((s,x)=>s+getSisa(x),0); if(!t) return (<div key={p.id} className="bg-white p-3 rounded border flex justify-between items-center"><div><div className="font-bold">{p.nama}</div></div><button onClick={()=>openT(p)} className="bg-blue-100 text-blue-700 px-3 py-1 rounded text-xs">+ Input</button></div>); return (<div key={p.id} className={`bg-white p-4 rounded-xl shadow-sm border ${checkKritis(tag,p.id,bb,bn)?'border-red-300':''}`}><div className="flex justify-between items-start mb-2 border-b pb-2"><div><div className="font-bold">{p.nama}</div></div><div className="text-right"><div className="text-[10px]">Hutang</div><div className={`font-black ${ht>0?'text-red-600':'text-green-600'}`}>{ht<=0?'LUNAS':formatRp(ht)}</div></div></div><div className="flex justify-between text-sm mb-3"><div>Aw: <b>{t.meterAwal}</b></div><div>Ak: <b>{t.meterAkhir}</b></div><div className="text-blue-600 font-bold">{formatRp(t.total)}</div></div><div className="grid grid-cols-4 gap-2"><button onClick={()=>openP(p)} className="col-span-2 bg-yellow-400 text-yellow-900 py-2 rounded font-bold text-xs">BAYAR</button><button onClick={()=>doCtk(p,t,false)} className="bg-gray-100 py-2 rounded text-gray-600"><Icon name="print"/></button><button onClick={()=>doCtk(p,t,true)} className="bg-green-100 py-2 rounded text-green-600"><Icon name="whatsapp" cl="fab fa-whatsapp"/></button><button onClick={()=>openT(p)} className="col-span-4 bg-blue-50 text-blue-600 py-1.5 rounded text-xs">Edit Tagihan</button></div></div>)})}</div>
                    )}

                    {m && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={svT} className="bg-white p-6 rounded-xl w-full max-w-sm"><h3 className="font-bold text-lg mb-4">Input: {sP.nama}</h3><div className="flex gap-2 mb-4"><input type="number" value={mA} onChange={e=>setMA(e.target.value)} placeholder="M.Awal" className="border p-2 w-1/2 rounded" required/><input type="number" value={mAk} onChange={e=>setMAk(e.target.value)} placeholder="M.Akhir" className="border p-2 w-1/2 rounded" required/></div><div className="font-bold text-lg mb-6 text-center">Total: {formatRp(tot)}</div><div className="flex justify-end gap-2">{eT&&adm&&<button type="button" onClick={()=>delT(eT.id)} className="mr-auto text-red-600 p-2"><Icon name="trash"/></button>}<button type="button" onClick={()=>setM(false)} className="px-4 py-2 border rounded">Batal</button><button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded">Simpan</button></div></form></div>}
                    {pM && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={svP} className="bg-white p-6 rounded-xl w-full max-w-sm"><h3 className="font-bold text-lg mb-2">Terima Uang</h3><p className="mb-4 font-bold text-red-600 text-center border-b pb-2">Total Hutang: {formatRp((tag.find(t=>t.idPelanggan===sP.id&&t.periode===per)?getSisa(tag.find(t=>t.idPelanggan===sP.id&&t.periode===per)):0)+tag.filter(t=>t.idPelanggan===sP.id&&getSisa(t)>0&&t.periode!==per).reduce((s,t)=>s+getSisa(t),0))}</p><input type="number" value={pN} onChange={e=>setPN(e.target.value)} className="border-2 p-3 w-full rounded text-center text-xl font-bold mb-6 focus:border-green-500 outline-none" placeholder="Uang Diserahkan" required/><div className="flex justify-end gap-2"><button type="button" onClick={()=>setPM(false)} className="px-4 py-2 border rounded">Batal</button><button type="submit" className="px-4 py-2 bg-green-600 text-white rounded font-bold">Proses Bayar</button></div></form></div>}
                </div>
            );
        }

        // --- 10. BUKU KAS & KELUHAN ---
        function PengMgr({ data, toast }) {
            const [m, setM] = useState(false); const [f, setF] = useState({tgl:curYMD(), ket:'', nom:''});
            const sv = async (e) => { e.preventDefault(); await DB_PUSAT.collection('pengeluaran').add({tanggal:f.tgl, keterangan:f.ket, nominal:Number(f.nom)}); setM(false); toast('Tersimpan!'); };
            return (<div className="space-y-4"><div className="flex justify-between items-center border-b pb-2"><h2 className="text-xl font-bold">Buku Kas</h2><button onClick={()=>setM(true)} className="bg-red-600 text-white px-3 py-1 rounded">Tambah</button></div><div className="bg-white border rounded-xl overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b"><tr><th className="p-3">Tgl</th><th className="p-3">Ket</th><th className="p-3">Nominal</th><th className="p-3">Aksi</th></tr></thead><tbody className="divide-y">{[...data].sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal)).map(k=><tr key={k.id}><td className="p-3">{k.tanggal}</td><td className="p-3">{k.keterangan}</td><td className="p-3 font-bold text-red-600">{formatRp(k.nominal)}</td><td className="p-3"><button onClick={async()=>{if(confirm('Hapus?'))await DB_PUSAT.collection('pengeluaran').doc(k.id).delete();toast('Dihapus!');}} className="text-red-600"><Icon name="trash"/></button></td></tr>)}</tbody></table></div>{m && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={sv} className="bg-white p-6 rounded-xl w-full max-w-sm"><h3 className="font-bold text-lg mb-4">Pengeluaran</h3><input type="date" value={f.tgl} onChange={e=>setF({...f, tgl:e.target.value})} className="border p-2 w-full mb-2 rounded" required/><input value={f.ket} onChange={e=>setF({...f, ket:e.target.value})} placeholder="Keterangan" className="border p-2 w-full mb-2 rounded" required/><input type="number" value={f.nom} onChange={e=>setF({...f, nom:e.target.value})} placeholder="Nominal" className="border p-2 w-full mb-4 rounded" required/><div className="flex justify-end gap-2"><button type="button" onClick={()=>setM(false)} className="px-4 py-2 border rounded">Batal</button><button type="submit" className="bg-red-600 text-white px-4 py-2 rounded">Simpan</button></div></form></div>}</div>);
        }

        function KelMgr({ data, pel, toast, adm, cUser }) {
            const wf = useWilayah(pel, adm, cUser); const [m, setM] = useState(false); const [eId, setEId] = useState(null); const [f, setF] = useState({tgl:curYMD(), idPel:'', kel:'', st:'Menunggu'}); const [src, setSrc] = useState('');
            const fd = data.filter(k=>wf.isMatch((pel.find(p=>p.id===k.idPelanggan)||{}).wilayah)).filter(k=>!src||(pel.find(x=>x.id===k.idPelanggan)?.nama||'').toLowerCase().includes(src.toLowerCase())).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
            const sv = async (e) => { e.preventDefault(); const pl={tanggal:f.tgl, idPelanggan:f.idPel, keluhan:f.kel, status:f.st}; if(eId)await DB_PUSAT.collection('keluhan').doc(eId).update(pl); else await DB_PUSAT.collection('keluhan').add(pl); setM(false); toast('Tersimpan!'); };
            return (<div className="space-y-4"><div className="flex justify-between items-center border-b pb-2"><h2 className="text-xl font-bold">Keluhan</h2><button onClick={()=>{setEId(null);setM(true);}} className="bg-orange-600 text-white px-3 py-1 rounded">Tambah</button></div><input placeholder="Cari Pelapor..." value={src} onChange={e=>setSrc(e.target.value)} className="border p-2 w-full rounded"/><div className="space-y-3">{fd.map(k=><div key={k.id} className="bg-white p-4 rounded-xl border flex justify-between items-center"><div><div className="font-bold">{pel.find(p=>p.id===k.idPelanggan)?.nama||'-'}</div><div className="text-sm text-red-600">{k.keluhan}</div><div className="text-xs bg-gray-100 inline-block px-2 py-1 mt-1 rounded">{k.status}</div></div><div><button onClick={()=>{setEId(k.id);setF({tgl:k.tanggal, idPel:k.idPelanggan, kel:k.keluhan, st:k.status});setM(true);}} className="text-blue-600 p-2"><Icon name="edit"/></button>{adm&&<button onClick={async()=>{if(confirm('Hapus?'))await DB_PUSAT.collection('keluhan').doc(k.id).delete();toast('Dihapus!');}} className="text-red-600 p-2"><Icon name="trash"/></button>}</div></div>)}</div>{m && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={sv} className="bg-white p-6 rounded-xl w-full max-w-sm"><h3 className="font-bold text-lg mb-4">Form Keluhan</h3><select value={f.idPel} onChange={e=>setF({...f, idPel:e.target.value})} className="border p-2 w-full mb-2 rounded" required><option value="">Pilih Warga...</option>{pel.filter(p=>wf.isMatch(p.wilayah)).map(p=><option key={p.id} value={p.id}>{p.nama}</option>)}</select><textarea value={f.kel} onChange={e=>setF({...f, kel:e.target.value})} placeholder="Isi Keluhan" className="border p-2 w-full mb-2 rounded" required/><select value={f.st} onChange={e=>setF({...f, st:e.target.value})} className="border p-2 w-full mb-4 rounded"><option>Menunggu</option><option>Proses</option><option>Selesai</option></select><div className="flex justify-end gap-2"><button type="button" onClick={()=>setM(false)} className="px-4 py-2 border rounded">Batal</button><button type="submit" className="bg-orange-600 text-white px-4 py-2 rounded">Simpan</button></div></form></div>}</div>);
        }

        // --- 11. PENGATURAN ---
        function PengMgr({ set, admU, toast }) {
            const dp = { 'Admin': ['dash','pel','tag','kel','peng','lap','set'], 'Petugas': ['pel','tag','kel'], 'Ketua HIPAB': ['dash','lap'] };
            const [fS, setFs] = useState(set); const [u, setU] = useState([]); const [ld, setLd] = useState(false);
            useEffect(() => { if (admU?.length > 0 && !ld) { setU(admU); setLd(true); } }, [admU, ld]);
            useEffect(() => { if (set) setFs(set); }, [set]);
            
            const sv = async (e) => { e.preventDefault(); if(u.some(x=>!x.username.trim()||!x.password.trim()))return alert("User/Pass kosong!"); try{ await DB_PUSAT.collection('pengaturan').doc('konfigurasi').set({...fS, tarif:Number(fS.tarif||0), beban:Number(fS.beban||0), batasBulanKritis:Number(fS.batasBulanKritis||3), batasNominalKritis:Number(fS.batasNominalKritis||350000)}); await DB_PUSAT.collection('pengaturan').doc('users').set({list:u}); toast("Disimpan!"); }catch(err){alert(err.message);} };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold border-b pb-2">Pengaturan</h2>
                    <div className="bg-white p-5 rounded-xl border">
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div><label className="text-xs">Nama App</label><input value={fS.appName||''} onChange={e=>setFs({...fS, appName:e.target.value})} className="border p-2 w-full rounded"/></div>
                            <div><label className="text-xs">Unit</label><input value={fS.appSubtitle||''} onChange={e=>setFs({...fS, appSubtitle:e.target.value})} className="border p-2 w-full rounded"/></div>
                            <div><label className="text-xs">Tarif/m3 (Rp)</label><input type="number" value={fS.tarif} onChange={e=>setFs({...fS, tarif:e.target.value})} className="border p-2 w-full rounded"/></div>
                            <div><label className="text-xs">Beban (Rp)</label><input type="number" value={fS.beban} onChange={e=>setFs({...fS, beban:e.target.value})} className="border p-2 w-full rounded"/></div>
                            <div><label className="text-xs">Batas Bln Kritis</label><input type="number" value={fS.batasBulanKritis} onChange={e=>setFs({...fS, batasBulanKritis:e.target.value})} className="border p-2 w-full rounded"/></div>
                            <div><label className="text-xs">Batas Nom Kritis</label><input type="number" value={fS.batasNominalKritis} onChange={e=>setFs({...fS, batasNominalKritis:e.target.value})} className="border p-2 w-full rounded"/></div>
                        </div>
                    </div>
                    <div className="bg-white p-5 rounded-xl border">
                        <div className="flex justify-between mb-3"><h3 className="font-bold">Akun Login</h3><button onClick={()=>setU([...u, {id:Date.now().toString(), username:'', password:'', role:'Petugas', wilayah:''}])} className="bg-gray-200 px-2 rounded text-sm">+ User</button></div>
                        <div className="space-y-2">{u.map((x,i)=><div key={x.id} className="flex gap-2 flex-wrap bg-gray-50 p-2 rounded"><input value={x.username} onChange={e=>setU(u.map(y=>y.id===x.id?{...y,username:e.target.value}:y))} placeholder="User" className="border p-1 rounded w-24 flex-1"/><input value={x.password} onChange={e=>setU(u.map(y=>y.id===x.id?{...y,password:e.target.value}:y))} placeholder="Pass" className="border p-1 rounded w-24 flex-1"/><select value={x.role} onChange={e=>setU(u.map(y=>y.id===x.id?{...y,role:e.target.value}:y))} className="border p-1 rounded w-24"><option>Admin</option><option>Petugas</option><option>Ketua HIPAB</option></select><input value={x.wilayah||''} onChange={e=>setU(u.map(y=>y.id===x.id?{...y,wilayah:e.target.value}:y))} placeholder="Wilayah (Opsional)" className="border p-1 rounded flex-1"/><button onClick={()=>setU(u.filter(y=>y.id!==x.id))} className="text-red-500 px-2"><Icon name="trash"/></button></div>)}</div>
                    </div>
                    <button onClick={sv} disabled={!ld} className="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">{ld?'SIMPAN PENGATURAN':'Memuat...'}</button>
                </div>
            );
        }

        // --- 12. PELAPORAN ---
        function LapMgr({ pel, tag, set }) {
            const [per, setPer] = useState(curYMD().slice(0,7));
            const htm = `<div class="tc"><h2>${set.appName}</h2><h3>Laporan Bulan ${per}</h3></div><br/><table><tr><th>Nama</th><th>Total</th><th>Dibayar</th><th>Sisa</th></tr>${tag.filter(t=>t.periode===per).map(t=>`<tr><td>${(pel.find(p=>p.id===t.idPelanggan)||{}).nama}</td><td class="tr">${formatRp(t.total)}</td><td class="tr">${formatRp(getTerbayar(t))}</td><td class="tr">${formatRp(getSisa(t))}</td></tr>`).join('')}</table>`;
            return (<div className="space-y-4"><h2 className="text-2xl font-bold">Pelaporan</h2><div className="bg-white p-4 rounded-xl border flex gap-4"><input type="month" value={per} onChange={e=>setPer(e.target.value)} className="border p-2 rounded"/><button onClick={()=>printDoc(htm,false)} className="bg-green-600 text-white px-4 rounded">Cetak PDF</button></div><div className="bg-white p-4 rounded-xl border overflow-x-auto"><div dangerouslySetInnerHTML={{__html:htm}}/></div></div>);
        }

        // --- 13. APP UTAMA ---
        function App() {
            const [fU, setFU] = useState(null); const [cU, setCU] = useState(()=>JSON.parse(localStorage.getItem('hipab_u')));
            const [tab, setTab] = useState('dash'); const [mob, setMob] = useState(false); const [tst, setTst] = useState(null);
            const [dPel, setDPel] = useState([]); const [dTag, setDTag] = useState([]); const [dPng, setDPng] = useState([]); const [dKel, setDKel] = useState([]); const [dAdm, setDAdm] = useState([]);
            const dPerm = { 'Admin': ['dash','pel','tag','kel','peng','lap','set'], 'Petugas': ['pel','tag','kel'], 'Ketua HIPAB': ['dash','lap'] };
            const [set, setSet] = useState({ appName: 'HIPAB SRIKOYO', appSubtitle: 'Desa Menongo', tarif: 1500, beban: 2000, batasBulanKritis: 3, batasNominalKritis: 350000, rolePermissions: dPerm });

            useEffect(() => { auth.signInAnonymously().catch(console.error); return auth.onAuthStateChanged(setFU); }, []);
            useEffect(() => {
                if(!fU) return;
                const un = [
                    DB_PUSAT.collection('pengaturan').doc('konfigurasi').onSnapshot(d => d.exists ? setSet(d.data()) : DB_PUSAT.collection('pengaturan').doc('konfigurasi').set(set)),
                    DB_PUSAT.collection('pengaturan').doc('users').onSnapshot(d => d.exists ? setDAdm(d.data().list || []) : DB_PUSAT.collection('pengaturan').doc('users').set({list:[{id:'1',username:'admin',password:'123',role:'Admin'}]}))
                ];
                if(cU) un.push(
                    DB_PUSAT.collection('pelanggan').onSnapshot(s => setDPel(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    DB_PUSAT.collection('tagihan').onSnapshot(s => setDTag(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    DB_PUSAT.collection('pengeluaran').onSnapshot(s => setDPng(s.docs.map(d => ({id:d.id, ...d.data()})))),
                    DB_PUSAT.collection('keluhan').onSnapshot(s => setDKel(s.docs.map(d => ({id:d.id, ...d.data()}))))
                );
                return () => un.forEach(f=>f());
            }, [cU, fU]);

            const showToast = (m) => { setTst(m); setTimeout(()=>setTst(null), 3000); };
            const logOut = () => { localStorage.removeItem('hipab_u'); setCU(null); setTab('dash'); };

            if(!fU) return <div className="flex h-screen items-center justify-center bg-blue-900 text-white"><Icon name="spinner fa-spin text-5xl"/></div>;
            if(!cU) return <Login users={dAdm} set={set} onLogin={(u)=>{localStorage.setItem('hipab_u',JSON.stringify(u));setCU(u);setTab((set.rolePermissions||dPerm)[u.role]?.[0]||'dash');}} showToast={showToast}/>;

            const isAdm = cU.role==='Admin', hA = (id) => (set.rolePermissions||dPerm)[cU.role||'Petugas']?.includes(id);
            const MN = [{i:'dash',l:'Dashboard',ic:'home'},{i:'pel',l:'Pelanggan',ic:'users'},{i:'tag',l:'Tagihan',ic:'file-invoice-dollar'},{i:'kel',l:'Keluhan',ic:'tools'},{i:'peng',l:'Buku Kas',ic:'book'},{i:'lap',l:'Pelaporan',ic:'chart-pie'},{i:'set',l:'Pengaturan',ic:'cog'}];
            
            const Side = () => (<><div className="p-6 border-b border-blue-800 text-center"><div className="font-black text-xl">{set.appName}</div><div className="text-xs text-blue-300 mt-2">Login: {cU.username}</div></div><div className="flex-1 p-4 space-y-2 overflow-y-auto">{MN.map(m=>hA(m.i)&&<NavBtn key={m.i} ic={m.ic} lb={m.l} act={tab===m.i} onClick={()=>{setTab(m.i);setMob(false);}}/>)}</div><div className="p-4"><button onClick={logOut} className="w-full bg-red-600 text-white p-2 rounded font-bold">Logout</button></div></>);

            return (
                <div className="flex h-screen bg-gray-100">
                    {tst && <div className="fixed top-4 right-4 z-50 bg-green-600 text-white p-3 rounded-lg shadow-lg font-bold animate-bounce">{tst}</div>}
                    <aside className="hidden md:flex flex-col w-64 bg-blue-900 text-white"><Side/></aside>
                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        <header className="md:hidden flex justify-between bg-blue-900 text-white p-4"><button onClick={()=>setMob(true)}><Icon name="bars text-xl"/></button><div className="font-bold">{set.appName}</div><div></div></header>
                        {mob && <div className="md:hidden fixed inset-0 z-50 flex"><div className="w-64 bg-blue-900 text-white flex flex-col"><div className="p-4 text-right"><button onClick={()=>setMob(false)}><Icon name="times text-xl"/></button></div><Side/></div><div className="flex-1 bg-black/50" onClick={()=>setMob(false)}></div></div>}
                        <main className="flex-1 overflow-y-auto p-4 md:p-6 pb-24">
                            {tab==='dash'&&<Dash pel={dPel} tag={dTag} peng={dPng} kel={dKel} adm={isAdm} cUser={cU} set={set}/>}
                            {tab==='pel'&&<PelMgr data={dPel} toast={showToast} adm={isAdm} cUser={cU}/>}
                            {tab==='tag'&&<TagMgr pel={dPel} tag={dTag} set={set} toast={showToast} adm={isAdm} cUser={cU}/>}
                            {tab==='kel'&&<KelMgr data={dKel} pel={dPel} toast={showToast} adm={isAdm} cUser={cU}/>}
                            {tab==='peng'&&<PengMgr data={dPng} toast={showToast}/>}
                            {tab==='lap'&&<LapMgr pel={dPel} tag={dTag} set={set}/>}
                            {tab==='set'&&<PengMgr set={set} admU={dAdm} toast={showToast}/>}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
