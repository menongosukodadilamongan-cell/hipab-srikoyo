<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Air Bersih</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom-server.browser.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-hidden">
    <div id="root"></div>
    <script type="text/babel">
        // KONFIGURASI FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCGxO7B7PMPv3YhSNVcm-CpWUcxVPIA4bM",
            authDomain: "hipab-srikoyo-data.firebaseapp.com",
            projectId: "hipab-srikoyo-data",
            storageBucket: "hipab-srikoyo-data.firebasestorage.app",
            messagingSenderId: "741286764093",
            appId: "1:741286764093:web:b355072e65eca80ea91454",
            measurementId: "G-C5YGGWQDPQ"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const DB_PUSAT = db.collection('srikoyo_database').doc('main_data');
        const { useState, useEffect } = React;

        // FUNGSI BANTUAN
        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
        const formatBulanTahunSingkat = (iso) => {
            if(!iso) return '';
            const [y, m] = iso.split('-');
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            return `${months[parseInt(m)-1]} ${y.slice(2)}`;
        };
        const formatBulanTahunLengkap = (iso) => {
            if(!iso) return '';
            const [y, m] = iso.split('-');
            const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            return `${months[parseInt(m)-1]} ${y}`;
        };
        const getCurrentDate = () => {
            const d = new Date();
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
            return `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        };
        const getCurrentDateYMD = () => new Date().toISOString().slice(0, 10);
        const copyToClipboard = (text) => {
            const t = document.createElement("textarea");
            t.value = text; document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); return true; } catch(err) { return false; } finally { document.body.removeChild(t); }
        };

        // SISTEM TAGIHAN
        const getTerbayar = (t) => t ? (t.terbayar !== undefined ? Number(t.terbayar) : (t.status === 'Terbayar' ? Number(t.total) : 0)) : 0;
        const getSisa = (t) => t ? Math.max(0, t.total - getTerbayar(t)) : 0;
        const getStatusLabel = (t) => { if (!t) return '-'; const s = getSisa(t), tb = getTerbayar(t); return s <= 0 ? 'LUNAS' : (tb > 0 ? 'NYICIL' : 'BELUM'); };
        const getTunggakanLalu = (tags, idPel, curPer) => tags.filter(t => t.idPelanggan === idPel && t.periode < curPer).reduce((s, t) => s + getSisa(t), 0);
        const checkKritis = (tags, idPel, bBln = 3, bNom = 350000) => {
            const utang = tags.filter(t => t.idPelanggan === idPel && getSisa(t) > 0);
            return (utang.length >= bBln || utang.reduce((s, t) => s + getSisa(t), 0) >= bNom);
        };
        const checkKebocoran = (tags, idPel, pemakaian, curPer) => {
            const tl = tags.filter(t => t.idPelanggan === idPel && t.periode < curPer).sort((a,b) => b.periode.localeCompare(a.periode)).slice(0, 3);
            if (tl.length === 0) return false;
            const avg = tl.reduce((s, t) => s + Math.max(0, t.meterAkhir - t.meterAwal), 0) / tl.length;
            return (avg > 0 && pemakaian > (avg * 2.5) && pemakaian > 10);
        };

        // CETAK STRUK
        const alignC = (txt) => String(txt).padStart(Math.floor((32 - String(txt).length) / 2) + String(txt).length).padEnd(32);
        const alignLR = (l, r) => String(l) + ' '.repeat(Math.max(0, 32 - String(l).length - String(r).length)) + String(r);
        const printContent = (html, mode) => {
            const ifrm = document.createElement('iframe');
            ifrm.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
            document.body.appendChild(ifrm);
            const doc = ifrm.contentWindow.document;
            let style = mode === 'receipt' 
                ? `<style>@page { size: 58mm auto; margin: 0; } body { width: 54mm; font-family: 'Segoe UI', sans-serif; font-size: 11px; margin: 2mm; color:#000; line-height: 1.4; } hr { border: 0.5px dashed #000; margin: 6px 0; } .text-center { text-align: center; } .text-right { text-align: right; } .bold { font-weight: bold; } .title { font-size: 14px; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; } table { width: 100%; font-size: 11px; } td { padding: 2px 0; }</style>`
                : `<style>@page { size: A4 portrait; margin: 15mm; } body { font-family: 'Segoe UI', sans-serif; color:#000; } table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; } th, td { border: 1px solid #333; padding: 8px; text-align: left; } th { background-color: #f3f4f6; text-align: center; } .text-center { text-align: center; } .text-right { text-align: right; } h2, h3 { margin: 0 0 5px 0; } .header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; text-align: center; text-transform: uppercase; } .no-border td { border: none; padding: 4px 0; }</style>`;
            doc.open(); doc.write(`<html><head><title>Cetak Dokumen</title>${style}</head><body>${html}</body></html>`); doc.close();
            ifrm.onload = () => { ifrm.contentWindow.focus(); ifrm.contentWindow.print(); setTimeout(() => document.body.removeChild(ifrm), 2000); };
        };

        const LogoRenderer = ({ logo, clName }) => (logo && logo.startsWith('data:image')) ? <img src={logo} className={clName} style={{objectFit:'contain', width:'100%', height:'100%'}}/> : <i className={`fas fa-tint ${clName}`}></i>;
        const NavItem = ({ icon, label, active, onClick }) => <button onClick={onClick} className={`flex items-center w-full px-4 py-3 text-sm font-medium rounded-lg transition-colors ${active ? 'bg-blue-800 text-white shadow-inner' : 'text-blue-200 hover:bg-blue-800 hover:text-white'}`}><i className={`fas ${icon} w-6 text-center mr-2 text-lg`}></i> {label}</button>;

        // CUSTOM HOOK WILAYAH
        const useWilayahFilter = (pelanggan, isAdmin, currentUser) => {
            const userWilayahList = currentUser.wilayah ? String(currentUser.wilayah).split(',').map(w=>w.trim()).filter(Boolean) : [];
            const isPetugasLocked = !isAdmin && userWilayahList.length > 0;
            const [filterWilayah, setFilterWilayah] = useState(isPetugasLocked ? userWilayahList[0] || 'Semua' : 'Semua');
            const allWilayahs = [...new Set(pelanggan.map(p => p.wilayah).filter(w => w && w.trim() !== ''))];
            const dropdownWilayahs = isPetugasLocked ? ['Semua', ...userWilayahList] : ['Semua', ...allWilayahs];
            const isMatchWilayah = (wil) => {
                if (isPetugasLocked) {
                    if (filterWilayah === 'Semua') return userWilayahList.includes(wil);
                    return wil === filterWilayah;
                }
                return filterWilayah === 'Semua' || wil === filterWilayah;
            };
            return { filterWilayah, setFilterWilayah, dropdownWilayahs, isPetugasLocked, isMatchWilayah };
        };

        // KOMPONEN LOGIN
        function LoginScreen({ users, settings, onLogin, showToast }) {
            const [user, setUser] = useState(''); const [pass, setPass] = useState('');
            const handleLogin = (e) => { 
                e.preventDefault(); 
                if(users.length === 0 && user === 'admin' && pass === 'admin123') { onLogin({username: 'admin', role: 'Admin', wilayah: ''}); showToast('Selamat Datang Admin!'); return; }
                const vUser = users.find(u => u.username === user && u.password === pass);
                if(vUser) { onLogin({...vUser, role: vUser.role || 'Admin', wilayah: vUser.wilayah || ''}); showToast(`Selamat Datang ${vUser.role}!`); } else alert('Username atau Password Salah!'); 
            };
            return (
                <div className="flex items-center justify-center min-h-[100dvh] bg-gradient-to-br from-blue-900 via-blue-800 to-blue-600 px-4">
                    <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all">
                        <div className="text-center mb-8">
                            <div className="bg-blue-100 w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 overflow-hidden p-3 text-blue-600"><LogoRenderer logo={settings.logo} clName="text-5xl" /></div>
                            <h2 className="text-2xl font-bold text-gray-800 uppercase leading-tight">{settings.appName}</h2>
                            <p className="text-base text-blue-600 font-bold mt-1">{settings.appSubtitle}</p>
                        </div>
                        <div className="space-y-4">
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Username</label><input type="text" value={user} onChange={e=>setUser(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none" required/></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Password</label><input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none" required/></div>
                        </div>
                        <button className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold mt-8 shadow-lg"><i className="fas fa-sign-in-alt mr-2"></i> Masuk Aplikasi</button>
                    </form>
                </div>
            );
        }

        // KOMPONEN DASHBOARD
        function Dashboard({ pelanggan, tagihan, pengeluaran, keluhan, isAdmin, currentUser, settings }) {
            const curMonth = getCurrentDateYMD().slice(0, 7);
            const wFilter = useWilayahFilter(pelanggan, isAdmin, currentUser);
            
            const filPel = pelanggan.filter(p => wFilter.isMatchWilayah(p.wilayah));
            const vPelIds = new Set(filPel.map(p => p.id));
            const vTags = tagihan.filter(t => vPelIds.has(t.idPelanggan));
            const tagsBln = vTags.filter(t => t.periode === curMonth);
            
            const pemasukan = tagsBln.reduce((s, t) => s + getTerbayar(t), 0);
            const tunggakan = tagsBln.reduce((s, t) => s + getSisa(t), 0);
            const totTunggak = vTags.reduce((s, t) => s + getSisa(t), 0);
            
            const bBln = settings?.batasBulanKritis !== undefined ? settings.batasBulanKritis : 3;
            const bNom = settings?.batasNominalKritis !== undefined ? settings.batasNominalKritis : 350000;
            const jmlKritis = Array.from(vPelIds).filter(id => checkKritis(vTags, id, bBln, bNom)).length;

            const pengBln = (isAdmin && wFilter.filterWilayah === 'Semua') ? pengeluaran.filter(k => k.tanggal.startsWith(curMonth)).reduce((s, k) => s + Number(k.nominal), 0) : 0;
            const kelPending = keluhan ? keluhan.filter(k => k.status !== 'Selesai' && vPelIds.has(k.idPelanggan)).length : 0;

            const chartData = Array.from({length: 6}, (_, i) => { const d = new Date(); d.setMonth(d.getMonth() - i); return d.toISOString().slice(0, 7); }).reverse()
                .map(m => ({ label: formatBulanTahunSingkat(m), value: vTags.filter(t => t.periode === m).reduce((s, t) => s + getTerbayar(t), 0) }));
            const maxVal = Math.max(...chartData.map(d => d.value), 100000) || 1;

            return (
                <div className="space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">Dashboard {wFilter.filterWilayah !== 'Semua' ? `(${wFilter.filterWilayah})` : ''}</h2>
                        <div className="flex gap-2 items-center">
                            <label className="text-sm font-medium text-gray-600 hidden md:block">Filter Wilayah:</label>
                            <select value={wFilter.filterWilayah} onChange={e=>wFilter.setFilterWilayah(e.target.value)} className="border p-2 rounded-lg text-sm outline-none bg-white font-bold text-blue-800 shadow-sm" disabled={wFilter.isPetugasLocked && wFilter.dropdownWilayahs.length <= 1}>
                                {wFilter.dropdownWilayahs.map(w => <option key={w} value={w}>{w === 'Semua' ? (wFilter.isPetugasLocked ? 'Semua Wilayah Tugas' : 'Semua Wilayah') : w}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div className="bg-red-50 border-l-4 border-red-600 p-5 rounded-xl shadow-sm flex justify-between items-center lg:col-span-3">
                            <div><p className="text-sm font-bold text-red-800 mb-1"><i className="fas fa-exclamation-triangle mr-1"></i> STATUS KRITIS (Wajib Ditagih)</p><p className="text-xs text-red-600">Pelanggan dengan tunggakan &ge;{bBln} bln ATAU &ge;{formatRp(bNom)}.</p></div>
                            <div className="text-right"><p className="text-3xl font-black text-red-700 animate-pulse">{jmlKritis}</p><p className="text-[10px] font-bold text-red-500 uppercase">Orang</p></div>
                        </div>
                        {[{t: 'Pemasukan Bulan Ini', v: formatRp(pemasukan), c: 'green', i: 'fa-hand-holding-usd'},{t: 'Sisa Tagihan Bulan Ini', v: formatRp(tunggakan), c: 'yellow', i: 'fa-exclamation-triangle'},{t: 'Total Seluruh Tunggakan', v: formatRp(totTunggak), c: 'red', i: 'fa-file-invoice-dollar'},{t: 'Pelanggan Aktif', v: `${filPel.filter(p=>p.status==='Aktif').length} Orang`, c: 'blue', i: 'fa-users'},{t: 'Keluhan Menunggu', v: `${kelPending} Laporan`, c: 'orange', i: 'fa-tools'}].map(c => (
                            <div key={c.t} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center"><div><p className="text-sm font-medium text-gray-500">{c.t}</p><p className={`text-xl font-bold text-${c.c}-600`}>{c.v}</p></div><div className={`bg-${c.c}-50 p-3 rounded-full`}><i className={`fas ${c.i} text-2xl text-${c.c}-500`}></i></div></div>
                        ))}
                        {(isAdmin && wFilter.filterWilayah === 'Semua') && <>
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center"><div><p className="text-sm font-medium text-gray-500">Pengeluaran Bln Ini</p><p className="text-xl font-bold text-red-600">{formatRp(pengBln)}</p></div><div className="bg-red-50 p-3 rounded-full"><i className="fas fa-money-bill-wave text-2xl text-red-500"></i></div></div>
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center"><div><p className="text-sm font-medium text-gray-500">Laba Bersih Bln Ini</p><p className="text-xl font-bold text-blue-800">{formatRp(pemasukan - pengBln)}</p></div><div className="bg-blue-50 p-3 rounded-full"><i className="fas fa-piggy-bank text-2xl text-blue-500"></i></div></div>
                        </>}
                    </div>

                    <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 mt-8">
                        <h3 className="text-lg font-bold mb-6 text-gray-700">Grafik Pemasukan (Berdasarkan Uang Masuk)</h3>
                        <div className="flex items-end space-x-2 md:space-x-4 h-64 border-b border-l border-gray-200 pb-2 pl-2">
                            {chartData.map((d, i) => (
                                <div key={i} className="flex flex-col items-center flex-1 h-full justify-end group">
                                    <div className="w-full bg-blue-500 rounded-t-sm hover:bg-blue-600 transition-all relative flex justify-center" style={{ height: `${(d.value / maxVal) * 100}%`, minHeight: '5%' }}>
                                        <span className="opacity-0 group-hover:opacity-100 absolute -top-8 bg-gray-800 text-white text-xs py-1 px-2 rounded whitespace-nowrap z-10 transition-opacity pointer-events-none">{formatRp(d.value)}</span>
                                    </div>
                                    <span className="text-[10px] md:text-xs mt-2 text-gray-500 font-medium text-center">{d.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // KOMPONEN PELANGGAN
        function PelangganManager({ data, showToast, isAdmin, currentUser }) {
            const wFilter = useWilayahFilter(data, isAdmin, currentUser);
            const [modal, setModal] = useState(false); const [editId, setEditId] = useState(null);
            const [form, setForm] = useState({ no: '', nama: '', wilayah: '', rt: '', rw: '', status: 'Aktif', hp: '' });
            const [search, setSearch] = useState(''); const [fStatus, setFStatus] = useState('Semua'); const [sortBy, setSortBy] = useState('noPelanggan');

            const filteredData = data.filter(p => wFilter.isMatchWilayah(p.wilayah))
                .filter(p => fStatus === 'Semua' || p.status === fStatus)
                .filter(p => p.nama.toLowerCase().includes(search.toLowerCase()) || p.noPelanggan.toLowerCase().includes(search.toLowerCase()))
                .sort((a, b) => {
                    if (sortBy === 'noPelanggan') return a.noPelanggan.localeCompare(b.noPelanggan, undefined, {numeric: true});
                    if (sortBy === 'wilayah') return (a.wilayah || '').localeCompare(b.wilayah || '');
                    return (`${a.rt}/${a.rw}`).localeCompare(`${b.rt}/${b.rw}`, undefined, {numeric: true});
                });

            const openModal = (p = null) => {
                if(p) { setEditId(p.id); setForm({ no: p.noPelanggan, nama: p.nama, wilayah: p.wilayah || '', rt: p.rt, rw: p.rw, status: p.status, hp: p.noHp }); }
                else { setEditId(null); setForm({ no: '', nama: '', wilayah: wFilter.isPetugasLocked ? wFilter.dropdownWilayahs[1] || '' : '', rt: '', rw: '', status: 'Aktif', hp: '' }); }
                setModal(true);
            };

            const simpan = async (e) => {
                e.preventDefault(); const payload = { noPelanggan: form.no, nama: form.nama, wilayah: form.wilayah, rt: form.rt, rw: form.rw, status: form.status, noHp: form.hp };
                try { if(editId) await DB_PUSAT.collection('pelanggan').doc(editId).update(payload); else await DB_PUSAT.collection('pelanggan').add(payload);
                setModal(false); showToast('Data Pelanggan Tersimpan'); } catch(err) { alert(err.message); }
            };

            const hapus = async (id) => { 
                if(!isAdmin) return alert("Hanya Admin yang bisa menghapus data!");
                if(window.confirm('Yakin ingin menghapus pelanggan ini?')) { await DB_PUSAT.collection('pelanggan').doc(id).delete(); showToast('Data Dihapus'); }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
                reader.onload = async (event) => {
                    const rows = event.target.result.split(/\r?\n/).filter(r => r.trim() !== '');
                    if (rows.length < 2) return alert('Format salah.');
                    const delim = rows[0].includes(';') ? ';' : ','; const isNew = rows[0].toLowerCase().includes('wilayah');
                    let succ = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const c = rows[i].split(delim).map(x => x.replace(/^"|"$/g, '').trim());
                        if (c.length >= 2) {
                            await DB_PUSAT.collection('pelanggan').add(isNew 
                                ? { noPelanggan: c[0]||'', nama: c[1]||'', wilayah: c[2]||'', rt: c[3]||'', rw: c[4]||'', status: (c[5]&&c[5].toLowerCase().includes('tidak'))?'Tidak Aktif':'Aktif', noHp: c[6]||'' }
                                : { noPelanggan: c[0]||'', nama: c[1]||'', wilayah: '', rt: c[2]||'', rw: c[3]||'', status: (c[4]&&c[4].toLowerCase().includes('tidak'))?'Tidak Aktif':'Aktif', noHp: c[5]||'' });
                            succ++;
                        }
                    }
                    showToast(`${succ} Diimport!`); e.target.value = null;
                }; reader.readAsText(file);
            };
            const downloadCSV = () => {
                const csv = "NoPelanggan;Nama;Wilayah;RT;RW;Status;NoHp\n" + filteredData.map(p => `"${p.noPelanggan}";"${p.nama}";"${p.wilayah || ''}";"${p.rt}";"${p.rw}";"${p.status}";"${p.noHp}"`).join('\n');
                const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob(["\ufeff", csv], { type: 'text/csv;charset=utf-8;' }));
                link.download = "Data_Pelanggan.csv"; link.click();
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">Pelanggan</h2>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto items-center">
                            <select value={wFilter.filterWilayah} onChange={e=>wFilter.setFilterWilayah(e.target.value)} className="border p-2 rounded-lg text-sm bg-white shadow-sm" disabled={wFilter.isPetugasLocked && wFilter.dropdownWilayahs.length <= 1}>
                                {wFilter.dropdownWilayahs.map(w => <option key={w} value={w}>{w === 'Semua' ? 'Semua Wilayah' : w}</option>)}
                            </select>
                            <select value={fStatus} onChange={e=>setFStatus(e.target.value)} className="border p-2 rounded-lg text-sm bg-white"><option value="Semua">Semua Status</option><option value="Aktif">Aktif</option><option value="Tidak Aktif">Tidak Aktif</option></select>
                            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="border p-2 rounded-lg text-sm bg-white hidden md:inline-block"><option value="noPelanggan">Urut No</option><option value="wilayah">Urut Wilayah</option><option value="rtRw">Urut RT/RW</option></select>
                            <div className="relative flex-1 md:w-40"><i className="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i><input type="text" placeholder="Cari..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full pl-9 pr-4 py-2 border rounded-lg text-sm"/></div>
                            {isAdmin && <button onClick={()=>openModal()} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm"><i className="fas fa-plus md:mr-2"></i> <span className="hidden md:inline">Tambah</span></button>}
                            {isAdmin && <div className="flex bg-white rounded-lg p-1 border">
                                <div className="relative overflow-hidden inline-block border-r pr-1"><input type="file" accept=".csv" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" /><button className="text-green-600 px-3 py-1.5 text-sm flex items-center pointer-events-none"><i className="fas fa-file-import md:mr-2"></i> <span className="hidden md:inline">Import</span></button></div>
                                <button onClick={downloadCSV} className="text-gray-700 hover:bg-gray-100 px-3 py-1.5 text-sm ml-1"><i className="fas fa-file-download md:mr-2"></i> <span className="hidden md:inline">Export</span></button>
                            </div>}
                        </div>
                    </div>
                    
                    <div className="hidden md:block bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                        <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b"><tr><th className="p-4">No.</th><th className="p-4">Nama</th><th className="p-4">Wilayah</th><th className="p-4">RT/RW</th><th className="p-4">No HP</th><th className="p-4">Status</th><th className="p-4 text-center">Aksi</th></tr></thead><tbody className="divide-y divide-gray-100">
                            {filteredData.map(p => (
                                <tr key={p.id} className="hover:bg-gray-50">
                                    <td className="p-4 font-medium">{p.noPelanggan}</td><td className="p-4">{p.nama}</td><td className="p-4">{p.wilayah || '-'}</td><td className="p-4">{p.rt}/{p.rw}</td><td className="p-4">{p.noHp}</td><td className="p-4"><span className={`px-2 py-1 rounded text-xs font-semibold ${p.status==='Aktif'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{p.status}</span></td>
                                    <td className="p-4 text-center space-x-3"><button onClick={()=>openModal(p)} className="text-blue-500 hover:text-blue-700"><i className="fas fa-edit"></i></button>{isAdmin && <button onClick={()=>hapus(p.id)} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button>}</td>
                                </tr>
                            ))}
                            {filteredData.length === 0 && <tr><td colSpan="7" className="p-6 text-center text-gray-500">Tidak ada data.</td></tr>}
                        </tbody></table>
                    </div>

                    <div className="md:hidden space-y-4">
                        {filteredData.map(p => (
                            <div key={p.id} className="bg-white p-4 rounded-xl shadow-sm border relative">
                                <div className="absolute top-4 right-4"><span className={`px-2 py-1 rounded text-[10px] font-bold ${p.status==='Aktif'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{p.status}</span></div>
                                <div className="pr-16"><h3 className="font-bold text-gray-800 text-base mb-1">{p.nama}</h3><div className="text-xs text-gray-500 space-y-1 mb-3"><p><i className="fas fa-id-badge w-4"></i> No: {p.noPelanggan}</p><p><i className="fas fa-map-marker w-4"></i> Wilayah: {p.wilayah||'-'} (RT {p.rt} / RW {p.rw})</p><p><i className="fas fa-phone w-4"></i> HP: {p.noHp||'-'}</p></div></div>
                                <div className="flex justify-end gap-2 border-t pt-3"><button onClick={()=>openModal(p)} className="flex-1 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-bold"><i className="fas fa-edit mr-2"></i> Edit</button>{isAdmin && <button onClick={()=>hapus(p.id)} className="flex-1 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-bold"><i className="fas fa-trash mr-2"></i> Hapus</button>}</div>
                            </div>
                        ))}
                    </div>

                    {modal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <form onSubmit={simpan} className="bg-white p-6 rounded-xl w-full max-w-md shadow-2xl">
                                <h3 className="font-bold text-xl mb-5 text-gray-800">{editId ? 'Edit Pelanggan' : 'Tambah Pelanggan'}</h3>
                                <div className="space-y-4 mb-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs font-medium text-gray-600 mb-1">No Pelanggan</label><input value={form.no} onChange={e=>setForm({...form, no:e.target.value})} className="border p-2 w-full rounded focus:ring-2 focus:ring-blue-500" required /></div>
                                        <div><label className="text-xs font-medium text-gray-600 mb-1">No HP</label><input value={form.hp} onChange={e=>setForm({...form, hp:e.target.value})} className="border p-2 w-full rounded focus:ring-2 focus:ring-blue-500" /></div>
                                    </div>
                                    <div><label className="text-xs font-medium text-gray-600 mb-1">Nama Lengkap</label><input value={form.nama} onChange={e=>setForm({...form, nama:e.target.value})} className="border p-2 w-full rounded focus:ring-2 focus:ring-blue-500" required /></div>
                                    <div><label className="text-xs font-medium text-gray-600 mb-1">Wilayah</label><input value={form.wilayah} onChange={e=>setForm({...form, wilayah:e.target.value})} className="border p-2 w-full rounded focus:ring-2 focus:ring-blue-500" disabled={wFilter.isPetugasLocked} /></div>
                                    <div className="grid grid-cols-3 gap-4">
                                        <div><label className="text-xs font-medium text-gray-600 mb-1">RT</label><input value={form.rt} onChange={e=>setForm({...form, rt:e.target.value})} className="border p-2 w-full rounded focus:ring-2 focus:ring-blue-500" /></div>
                                        <div><label className="text-xs font-medium text-gray-600 mb-1">RW</label><input value={form.rw} onChange={e=>setForm({...form, rw:e.target.value})} className="border p-2 w-full rounded focus:ring-2 focus:ring-blue-500" /></div>
                                        <div><label className="text-xs font-medium text-gray-600 mb-1">Status</label><select value={form.status} onChange={e=>setForm({...form, status:e.target.value})} className="border p-2 w-full rounded"><option>Aktif</option><option>Tidak Aktif</option></select></div>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3"><button type="button" onClick={()=>setModal(false)} className="px-5 py-2 border rounded-lg text-gray-600">Batal</button><button type="submit" className="px-5 py-2 bg-blue-600 text-white rounded-lg">Simpan</button></div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        // KOMPONEN TAGIHAN
        function TagihanManager({ pelanggan, tagihan, settings, showToast, isAdmin, currentUser }) {
            const wFilter = useWilayahFilter(pelanggan, isAdmin, currentUser);
            const [periode, setPeriode] = useState(getCurrentDateYMD().slice(0, 7));
            const [isFastMode, setIsFastMode] = useState(false); const [fastInputs, setFastInputs] = useState({}); const [isSavingMassal, setIsSavingMassal] = useState(false);
            const [search, setSearch] = useState(''); const [fStatus, setFStatus] = useState('Semua'); const [sortBy, setSortBy] = useState('noPelanggan');
            const [modal, setModal] = useState(false); const [selP, setSelP] = useState(null); const [existT, setExistT] = useState(null);
            const [mAwal, setMAwal] = useState(''); const [mAkhir, setMAkhir] = useState('');
            const [payModal, setPayModal] = useState(false); const [payNominal, setPayNominal] = useState('');

            const bBln = settings?.batasBulanKritis !== undefined ? settings.batasBulanKritis : 3;
            const bNom = settings?.batasNominalKritis !== undefined ? settings.batasNominalKritis : 350000;
            const kubik = Math.max(0, Number(mAkhir) - Number(mAwal));
            const totalHitung = (kubik * settings.tarif) + settings.beban;
            const isBocorModal = checkKebocoran(tagihan, selP?.id, kubik, periode);

            const filteredPelanggan = pelanggan.filter(p => p.status === 'Aktif' || tagihan.some(t => t.idPelanggan === p.id && t.periode === periode))
                .filter(p => wFilter.isMatchWilayah(p.wilayah))
                .filter(p => {
                    const t = tagihan.find(x => x.idPelanggan === p.id && x.periode === periode);
                    if(fStatus === 'Semua') return true;
                    if(fStatus === 'KRITIS') return checkKritis(tagihan, p.id, bBln, bNom);
                    const hutang = tagihan.filter(x => x.idPelanggan === p.id).reduce((s, x) => s + getSisa(x), 0);
                    if(fStatus === 'LUNAS') return hutang <= 0 && t;
                    if(fStatus === 'BELUM') return hutang > 0 && (!t || t.status === 'Belum Terbayar');
                    if(fStatus === 'NYICIL') return t && getTerbayar(t) > 0 && getSisa(t) > 0;
                    return true;
                }).filter(p => p.nama.toLowerCase().includes(search.toLowerCase()) || p.noPelanggan.toLowerCase().includes(search.toLowerCase()))
                .sort((a, b) => {
                    if (sortBy === 'noPelanggan') return a.noPelanggan.localeCompare(b.noPelanggan, undefined, {numeric: true});
                    if (sortBy === 'wilayah') return (a.wilayah || '').localeCompare(b.wilayah || '');
                    return (`${a.rt}/${a.rw}`).localeCompare(`${b.rt}/${b.rw}`, undefined, {numeric: true});
                });

            const getMAwPrev = (id) => {
                const [y, m] = periode.split('-'); let prevM = parseInt(m)-1, prevY = parseInt(y);
                if(prevM === 0) { prevM = 12; prevY -= 1; }
                const tLalu = tagihan.find(x => x.idPelanggan === id && x.periode === `${prevY}-${prevM.toString().padStart(2, '0')}`);
                return tLalu ? tLalu.meterAkhir : 0;
            };

            const openTagihan = (p) => {
                const t = tagihan.find(x => x.idPelanggan === p.id && x.periode === periode);
                setSelP(p); setExistT(t);
                if(t) { setMAwal(t.meterAwal); setMAkhir(t.meterAkhir); } else { setMAwal(getMAwPrev(p.id)); setMAkhir(''); }
                setModal(true);
            };

            const simpanTagihan = async (e) => {
                e.preventDefault();
                const pl = { idPelanggan: selP.id, periode, meterAwal: Number(mAwal), meterAkhir: Number(mAkhir), total: totalHitung, terbayar: existT ? getTerbayar(existT) : 0, status: existT ? existT.status : 'Belum Terbayar' };
                try { if(existT) await DB_PUSAT.collection('tagihan').doc(existT.id).update(pl); else await DB_PUSAT.collection('tagihan').add(pl); setModal(false); showToast('Tersimpan'); } catch(err) { alert(err.message); }
            };

            const simpanMassal = async () => {
                setIsSavingMassal(true); let count = 0;
                try {
                    await Promise.all(filteredPelanggan.map(async (p) => {
                        const val = fastInputs[p.id];
                        if (val !== undefined && val !== '') {
                            const mAk = Number(val), t = tagihan.find(x => x.idPelanggan === p.id && x.periode === periode), mAw = t ? t.meterAwal : getMAwPrev(p.id);
                            const tHitung = (Math.max(0, mAk - mAw) * settings.tarif) + settings.beban;
                            if (t) { if (t.meterAkhir !== mAk) { await DB_PUSAT.collection('tagihan').doc(t.id).update({ meterAkhir: mAk, total: tHitung, meterAwal: mAw }); count++; } }
                            else { await DB_PUSAT.collection('tagihan').add({ idPelanggan: p.id, periode, meterAwal: mAw, meterAkhir: mAk, total: tHitung, terbayar: 0, status: 'Belum Terbayar' }); count++; }
                        }
                    }));
                    if(count > 0) showToast(`${count} Data Tersimpan!`); setFastInputs({}); setIsFastMode(false);
                } catch(err) { alert(err.message); }
                setIsSavingMassal(false);
            };

            const hapusTagihan = async (id) => { 
                if(!isAdmin) return alert("Hanya Admin yang bisa menghapus tagihan!");
                if(window.confirm('Hapus tagihan?')) { await DB_PUSAT.collection('tagihan').doc(id).delete(); setModal(false); showToast('Tagihan Dihapus'); } 
            };

            const openPayModal = (p) => { setSelP(p); setPayNominal(''); setPayModal(true); };

            const simpanPayGlobal = async (e) => {
                e.preventDefault(); let uang = Number(payNominal); const asli = uang; 
                if(uang < 0) return alert("Tidak valid!");
                try {
                    const curT = tagihan.find(t => t.idPelanggan === selP.id && t.periode === periode);
                    const unpLain = tagihan.filter(t => t.idPelanggan === selP.id && getSisa(t) > 0 && t.periode !== periode).sort((a,b)=>a.periode.localeCompare(b.periode));
                    const totHut = (curT ? getSisa(curT) : 0) + unpLain.reduce((s,t)=>s+getSisa(t), 0);
                    const kembalian = Math.max(0, asli - totHut);
                    const tId = curT ? curT.id : (unpLain.length > 0 ? unpLain[unpLain.length-1].id : null);

                    const bayarTagihan = async (t) => {
                        const sisa = getSisa(t), bayar = Math.min(uang, sisa);
                        await DB_PUSAT.collection('tagihan').doc(t.id).update({
                            terbayar: getTerbayar(t) + bayar, status: (getTerbayar(t) + bayar) >= t.total ? 'Terbayar' : 'Belum Terbayar', petugasPenagih: currentUser.username,
                            ...(t.id === tId && { uangDiserahkan: asli, kembalian })
                        });
                        uang -= bayar;
                    };

                    if (curT && uang > 0) {
                        if (getSisa(curT) > 0) await bayarTagihan(curT);
                        else if (curT.id === tId) await DB_PUSAT.collection('tagihan').doc(curT.id).update({ uangDiserahkan: asli, kembalian, petugasPenagih: currentUser.username });
                    }
                    if (uang > 0) for(let t of unpLain) { if(uang <= 0) break; await bayarTagihan(t); }
                    setPayModal(false); setPayNominal(''); showToast('Pembayaran Dicatat!');
                } catch(err) { alert(err.message); }
            };

            const doCetak = (p, t, isWA) => {
                const tunggakanLalu = getTunggakanLalu(tagihan, p.id, t.periode);
                const hutang = tagihan.filter(x => x.idPelanggan === p.id).reduce((s, x) => s + getSisa(x), 0);
                const isKritis = checkKritis(tagihan, p.id, bBln, bNom);
                const warn = isKritis ? `\n⚠️ *PEMBERITAHUAN*: Tunggakan Bapak/Ibu mencapai batas maksimal. Dimohon segera melunasi/mencicil.` : '';
                
                if (isWA) {
                    const msg = `Yth. Bapak/Ibu ${p.nama},\nTagihan air bersih ${settings.appName} periode ${formatBulanTahunLengkap(t.periode)}.\n\n*Rincian:*\n- Meter Awal : ${t.meterAwal}\n- Meter Akhir: ${t.meterAkhir}\n- Pemakaian  : ${t.meterAkhir - t.meterAwal} m3\n\n*Tagihan Bln Ini : ${formatRp(t.total)}*\n*Tunggakan Lalu  : ${formatRp(tunggakanLalu)}*\n*Total Tagihan   : ${formatRp(t.total + tunggakanLalu)}*\n\nStatus: ${hutang <= 0 ? 'LUNAS ✅' : 'BELUM LUNAS ❌'}\nSisa Tunggakan: ${formatRp(hutang)}${warn}\n\nTerima kasih.`;
                    copyToClipboard(msg); showToast("Pesan WA Disalin!"); return;
                }

                const uangT = t.uangDiserahkan || getTerbayar(t), uangK = t.kembalian || 0, pet = t.petugasPenagih || currentUser.username;
                const isMobile = window.innerWidth < 768;
                
                if (isMobile) {
                    const txt = `${alignC(settings.appName.toUpperCase())}\n${settings.appSubtitle?alignC(settings.appSubtitle.toUpperCase())+'\n':''}${alignC('DESA MENONGO-SUKODADI-LAMONGAN')}\n--------------------------------\nNO: ${p.noPelanggan}\nNAMA: ${p.nama}\nPERIODE: ${formatBulanTahunSingkat(t.periode)}\n--------------------------------\n${alignLR('M.AWAL',t.meterAwal)}\n${alignLR('M.AKHIR',t.meterAkhir)}\n${alignLR('PAKAI',(t.meterAkhir-t.meterAwal)+' m3')}\n--------------------------------\n${alignLR('TAGIHAN',formatRp(t.total))}\n${alignLR('TUNGGAKAN',formatRp(tunggakanLalu))}\n${alignLR('TOTAL',formatRp(t.total+tunggakanLalu))}\n--------------------------------\n${alignLR('DIBAYAR',formatRp(uangT))}\n${uangK>0?alignLR('KEMBALI',formatRp(uangK))+'\n':''}${alignLR('SISA HTG',formatRp(hutang))}\n--------------------------------\n${alignC(hutang<=0?'*** LUNAS ***':'BELUM LUNAS')}\n${alignC(`PETUGAS: ${pet.toUpperCase()}`)}\n\n`;
                    if (navigator.share) navigator.share({ title: 'Struk', text: txt }).catch(() => copyToClipboard(txt)); else copyToClipboard(txt);
                    showToast("Teks struk disalin!");
                } else {
                    const h = `<div class="text-center"><div class="title">${settings.appName}</div>${settings.appSubtitle?`<div>${settings.appSubtitle}</div>`:''}<div>MENONGO-SUKODADI</div></div><hr/><table><tr><td>NO</td><td>: ${p.noPelanggan}</td></tr><tr><td>NAMA</td><td>: ${p.nama}</td></tr><tr><td>PERIODE</td><td>: ${formatBulanTahunSingkat(t.periode)}</td></tr></table><hr/><table><tr><td>M.AWAL</td><td class="text-right">${t.meterAwal}</td></tr><tr><td>M.AKHIR</td><td class="text-right">${t.meterAkhir}</td></tr><tr><td>PAKAI</td><td class="text-right">${t.meterAkhir-t.meterAwal} m3</td></tr></table><hr/><table><tr><td>TAGIHAN</td><td class="text-right">${formatRp(t.total)}</td></tr><tr><td>TUNGGAKAN</td><td class="text-right">${formatRp(tunggakanLalu)}</td></tr><tr class="bold"><td>TOTAL</td><td class="text-right">${formatRp(t.total+tunggakanLalu)}</td></tr></table><hr/><table><tr><td>DIBAYAR</td><td class="text-right">${formatRp(uangT)}</td></tr>${uangK>0?`<tr><td>KEMBALI</td><td class="text-right">${formatRp(uangK)}</td></tr>`:''}<tr class="bold" style="color:red"><td>SISA HUTANG</td><td class="text-right">${formatRp(hutang)}</td></tr></table><hr/><div class="text-center"><div class="bold" style="font-size:16px">${hutang<=0?'LUNAS':'BELUM LUNAS'}</div><div style="font-size:11px;margin-top:4px">PETUGAS: ${pet.toUpperCase()}</div></div>`;
                    printContent(h, 'receipt');
                }
            };

            return (
                <div className="space-y-4">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">Tagihan & Pembayaran</h2>
                        <div className="flex flex-wrap gap-2 items-center w-full md:w-auto">
                            <select value={wFilter.filterWilayah} onChange={e=>wFilter.setFilterWilayah(e.target.value)} className="border p-2 rounded-lg text-sm bg-white shadow-sm" disabled={wFilter.isPetugasLocked && wFilter.dropdownWilayahs.length <= 1}>
                                {wFilter.dropdownWilayahs.map(w => <option key={w} value={w}>{w === 'Semua' ? 'Semua Wilayah' : w}</option>)}
                            </select>
                            <button onClick={() => setIsFastMode(!isFastMode)} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center ${isFastMode ? 'bg-gray-600 text-white' : 'bg-indigo-600 text-white'}`}><i className={`fas ${isFastMode ? 'fa-times' : 'fa-bolt'} mr-2`}></i>{isFastMode ? 'Tutup Keliling' : 'Mode Keliling'}</button>
                            <select value={fStatus} onChange={e=>setFStatus(e.target.value)} className="border p-2 rounded-lg text-sm bg-white shadow-sm"><option value="Semua">Semua</option><option value="BELUM">Belum Lunas</option><option value="NYICIL">Nyicil</option><option value="LUNAS">Lunas</option><option value="KRITIS">⚠️ Kritis</option></select>
                            <div className="flex items-center space-x-2 bg-white px-3 py-1.5 border rounded-lg"><input type="month" value={periode} onChange={e=>setPeriode(e.target.value)} className="outline-none text-sm font-bold bg-transparent"/></div>
                            <div className="relative flex-1 md:w-40"><i className="fas fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i><input type="text" placeholder="Cari..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full pl-9 pr-3 py-2 border rounded-lg text-sm"/></div>
                        </div>
                    </div>

                    {!isFastMode && isAdmin && (
                        <div className="grid grid-cols-3 gap-2 md:gap-4 mb-4">
                            <div className="bg-blue-50 border border-blue-100 p-3 rounded-xl text-center shadow-sm"><p className="text-[10px] md:text-xs text-blue-600 font-bold uppercase mb-1">Tagihan</p><p className="text-sm md:text-lg font-bold text-blue-900">{formatRp(tagihan.filter(t => t.periode === periode && filteredPelanggan.some(p => p.id === t.idPelanggan)).reduce((s, t) => s + t.total, 0))}</p></div>
                            <div className="bg-green-50 border border-green-100 p-3 rounded-xl text-center shadow-sm"><p className="text-[10px] md:text-xs text-green-600 font-bold uppercase mb-1">Uang Masuk</p><p className="text-sm md:text-lg font-bold text-green-900">{formatRp(tagihan.filter(t => t.periode === periode && filteredPelanggan.some(p => p.id === t.idPelanggan)).reduce((s, t) => s + getTerbayar(t), 0))}</p></div>
                            <div className="bg-red-50 border border-red-100 p-3 rounded-xl text-center shadow-sm"><p className="text-[10px] md:text-xs text-red-600 font-bold uppercase mb-1">Sisa</p><p className="text-sm md:text-lg font-bold text-red-900">{formatRp(tagihan.filter(t => t.periode === periode && filteredPelanggan.some(p => p.id === t.idPelanggan)).reduce((s, t) => s + getSisa(t), 0))}</p></div>
                        </div>
                    )}

                    {isFastMode ? (
                        <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 mb-4">
                            <div className="flex justify-between items-center mb-4">
                                <div><h3 className="font-bold text-indigo-900"><i className="fas fa-running mr-2"></i> Mode Keliling</h3></div>
                                <button onClick={simpanMassal} disabled={isSavingMassal} className="px-6 py-2 bg-green-600 text-white rounded-lg font-bold"><i className="fas fa-save mr-2"></i> Simpan</button>
                            </div>
                            <div className="space-y-3">
                                {filteredPelanggan.map(p => {
                                    const t = tagihan.find(x => x.idPelanggan === p.id && x.periode === periode), mAw = t ? t.meterAwal : getMAwPrev(p.id);
                                    const val = fastInputs[p.id] !== undefined ? fastInputs[p.id] : (t ? t.meterAkhir : ''), isBocor = val !== '' ? checkKebocoran(tagihan, p.id, Math.max(0, Number(val) - mAw), periode) : false;
                                    return (
                                        <div key={p.id} className="bg-white p-3 rounded-xl shadow-sm border border-indigo-200 flex items-center justify-between gap-2">
                                            <div className="w-[55%]"><div className="font-bold text-[15px] truncate">{p.nama}</div><div className="text-[10px] text-gray-500 mb-1">{p.noPelanggan} • {p.wilayah||''}</div><div className="text-xs font-bold text-indigo-800 bg-indigo-50 px-2 py-1 rounded">Awal: {mAw}</div></div>
                                            <div className="w-[45%]"><input type="number" min={mAw} value={val} onChange={e => setFastInputs({...fastInputs, [p.id]: e.target.value})} className="border-2 border-indigo-300 p-2 w-full rounded-lg text-center font-black text-lg" placeholder="Akhir" />{isBocor && <div className="text-[10px] text-red-600 font-bold mt-1 text-center">⚠️ Bocor</div>}</div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    ) : (
                        <div className="md:hidden space-y-4">
                            {filteredPelanggan.map(p => {
                                const t = tagihan.find(x => x.idPelanggan === p.id && x.periode === periode), hutang = tagihan.filter(x => x.idPelanggan === p.id).reduce((s, x) => s + getSisa(x), 0), isKritis = checkKritis(tagihan, p.id, bBln, bNom);
                                if(!t) return (<div key={p.id} className="bg-white p-4 rounded-xl shadow-sm border"><div className="font-bold">{p.nama}</div><button onClick={()=>openTagihan(p)} className="w-full mt-2 py-2 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold">Input Tagihan</button></div>);
                                return (
                                    <div key={p.id} className={`bg-white p-4 rounded-xl shadow-sm border ${isKritis ? 'border-red-300 bg-red-50/20' : ''}`}>
                                        <div className="flex justify-between items-start mb-3 border-b pb-2">
                                            <div><div className="font-bold text-lg">{p.nama}</div>{isKritis && <div className="text-[10px] text-white bg-red-600 px-2 py-1 rounded-full animate-pulse">STATUS KRITIS</div>}</div>
                                            <div className="text-right"><div className="text-[10px] text-gray-500 uppercase">Hutang</div><div className={`text-xl font-black ${hutang>0?'text-red-600':'text-green-600'}`}>{hutang<=0?'LUNAS':formatRp(hutang)}</div></div>
                                        </div>
                                        <div className="grid grid-cols-4 gap-2">
                                            <button onClick={()=>openPayModal(p)} className="col-span-2 py-3 bg-yellow-400 text-yellow-900 rounded-xl font-black text-sm"><i className="fas fa-hand-holding-usd mr-2"></i> BAYAR</button>
                                            <button onClick={()=>doCetak(p,t,false)} className="py-3 bg-gray-100 rounded-xl"><i className="fas fa-print"></i></button>
                                            <button onClick={()=>doCetak(p,t,true)} className="py-3 bg-green-100 text-green-700 rounded-xl"><i className="fab fa-whatsapp"></i></button>
                                            <button onClick={()=>openTagihan(p)} className="col-span-4 py-2 mt-1 border text-blue-600 rounded-xl text-sm font-bold"><i className="fas fa-edit mr-2"></i> Edit Meteran</button>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    )}
                    
                    <div className="hidden md:block bg-white rounded-xl shadow-sm border overflow-x-auto">
                         <table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b"><tr><th className="p-4">Pelanggan</th><th className="p-4">Tagihan Bln Ini</th><th className="p-4">Sisa Bln Ini</th><th className="p-4 text-red-700">TOTAL TUNGGAKAN</th><th className="p-4 text-center">Aksi</th></tr></thead><tbody className="divide-y">
                                {filteredPelanggan.map(p => {
                                    const t = tagihan.find(x => x.idPelanggan === p.id && x.periode === periode);
                                    if(!t) return <tr key={p.id}><td className="p-4 font-bold">{p.nama}</td><td colSpan="4"><button onClick={()=>openTagihan(p)} className="bg-blue-600 text-white px-3 py-1 rounded text-xs">Input Tagihan</button></td></tr>;
                                    const hutang = tagihan.filter(x => x.idPelanggan === p.id).reduce((s, x) => s + getSisa(x), 0);
                                    return (
                                        <tr key={p.id}>
                                            <td className="p-4 font-bold">{p.nama}</td><td className="p-4">{formatRp(t.total)}</td><td className="p-4">{formatRp(getSisa(t))}</td>
                                            <td className="p-4 font-bold text-red-600">{hutang<=0?'LUNAS':formatRp(hutang)} {checkKritis(tagihan, p.id, bBln, bNom) && <span className="animate-pulse">⚠️ KRITIS</span>}</td>
                                            <td className="p-4 text-center space-x-2"><button onClick={()=>doCetak(p,t,false)} className="p-2 border rounded"><i className="fas fa-print"></i></button><button onClick={()=>doCetak(p,t,true)} className="p-2 border rounded text-green-600"><i className="fab fa-whatsapp"></i></button><button onClick={()=>openPayModal(p)} className="p-2 border rounded text-yellow-600"><i className="fas fa-hand-holding-usd"></i></button><button onClick={()=>openTagihan(p)} className="p-2 border rounded text-blue-600"><i className="fas fa-edit"></i></button></td>
                                        </tr>
                                    )
                                })}
                        </tbody></table>
                    </div>

                    {modal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <form onSubmit={simpanTagihan} className="bg-white p-6 rounded-xl w-full max-w-sm">
                                <h3 className="font-bold text-lg mb-4">Tagihan: {selP.nama}</h3>
                                <div className="flex gap-3 mb-4"><div className="w-1/2"><label className="text-xs mb-1">M.Awal</label><input type="number" min="0" value={mAwal} onChange={e=>setMAwal(e.target.value)} className="border p-2 w-full rounded" required/></div><div className="w-1/2"><label className="text-xs mb-1">M.Akhir</label><input type="number" min={mAwal} value={mAkhir} onChange={e=>setMAkhir(e.target.value)} className="border p-2 w-full rounded" required/></div></div>
                                <div className="flex justify-between font-bold text-lg mb-6"><span>Total:</span><span>{formatRp(totalHitung)}</span></div>
                                <div className="flex justify-end gap-3">{existT && isAdmin && <button type="button" onClick={()=>hapusTagihan(existT.id)} className="mr-auto text-red-600"><i className="fas fa-trash"></i></button>}<button type="button" onClick={()=>setModal(false)} className="px-4 py-2 border rounded-lg">Batal</button><button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg">Simpan</button></div>
                            </form>
                        </div>
                    )}
                    {payModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <form onSubmit={simpanPayGlobal} className="bg-white p-6 rounded-xl w-full max-w-sm">
                                <h3 className="font-bold text-lg mb-4">Terima Uang: {selP.nama}</h3>
                                {(() => {
                                    const cT = tagihan.find(t => t.idPelanggan === selP.id && t.periode === periode);
                                    const totHut = (cT ? getSisa(cT) : 0) + tagihan.filter(t => t.idPelanggan === selP.id && getSisa(t) > 0 && t.periode !== periode).reduce((s,t)=>s+getSisa(t), 0);
                                    const kemb = Number(payNominal) > totHut ? Number(payNominal) - totHut : 0;
                                    return (
                                        <>
                                            <div className="flex justify-between font-bold text-lg mb-4"><span>Hutang Total:</span><span>{formatRp(totHut)}</span></div>
                                            <input type="number" min="0" value={payNominal} onChange={e=>setPayNominal(e.target.value)} className="border p-3 w-full rounded-lg text-center font-bold text-xl mb-4" placeholder="Uang Warga" required />
                                            {kemb > 0 && <div className="bg-green-50 text-green-800 p-3 rounded-lg text-center font-bold mb-4 animate-pulse">KEMBALIAN: {formatRp(kemb)}</div>}
                                        </>
                                    );
                                })()}
                                <div className="flex justify-end gap-3"><button type="button" onClick={()=>setPayModal(false)} className="px-4 py-2 border rounded-lg">Batal</button><button type="submit" className="px-4 py-2 bg-green-600 text-white rounded-lg">Bayar</button></div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        // KOMPONEN LAINNYA 
        const GenericTable = ({ title, btnL, cols, data, rowRender, onAdd }) => (
            <div className="space-y-4">
                <div className="flex justify-between items-center border-b pb-4"><h2 className="text-2xl font-bold">{title}</h2><button onClick={onAdd} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">{btnL}</button></div>
                <div className="bg-white rounded-xl border overflow-x-auto"><table className="w-full text-sm text-left"><thead className="bg-gray-50 border-b"><tr>{cols.map(c=><th key={c} className="p-4">{c}</th>)}</tr></thead><tbody className="divide-y">{data.map(rowRender)}</tbody></table></div>
            </div>
        );

        function PengeluaranManager({ data, showToast }) {
            const [modal, setModal] = useState(false); const [form, setForm] = useState({ tanggal: getCurrentDateYMD(), keterangan: '', nominal: '' });
            const simpan = async (e) => { e.preventDefault(); try { await DB_PUSAT.collection('pengeluaran').add({ ...form, nominal: Number(form.nominal) }); setModal(false); showToast('Tersimpan'); } catch(err) { alert(err.message); } };
            const hapus = async (id) => { if(window.confirm('Hapus?')) { await DB_PUSAT.collection('pengeluaran').doc(id).delete(); showToast('Dihapus'); } };
            return (
                <>
                    <GenericTable title="Buku Kas (Pengeluaran)" btnL="Tambah" cols={['Tanggal','Keterangan','Nominal','Aksi']} data={[...data].sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal))} onAdd={()=>setModal(true)} rowRender={k=>(<tr key={k.id}><td className="p-4">{k.tanggal}</td><td className="p-4">{k.keterangan}</td><td className="p-4 font-bold text-red-600">{formatRp(k.nominal)}</td><td className="p-4"><button onClick={()=>hapus(k.id)} className="text-red-500"><i className="fas fa-trash"></i></button></td></tr>)}/>
                    {modal && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={simpan} className="bg-white p-6 rounded-xl w-full max-w-md"><h3 className="font-bold text-xl mb-4">Catat Pengeluaran</h3><div className="space-y-4 mb-6"><div><label className="text-xs">Tanggal</label><input type="date" value={form.tanggal} onChange={e=>setForm({...form, tanggal:e.target.value})} className="border p-2 w-full rounded" required/></div><div><label className="text-xs">Keterangan</label><input value={form.keterangan} onChange={e=>setForm({...form, keterangan:e.target.value})} className="border p-2 w-full rounded" required/></div><div><label className="text-xs">Nominal</label><input type="number" value={form.nominal} onChange={e=>setForm({...form, nominal:e.target.value})} className="border p-2 w-full rounded" required/></div></div><div className="flex justify-end gap-3"><button type="button" onClick={()=>setModal(false)} className="px-4 py-2 border rounded-lg">Batal</button><button type="submit" className="px-4 py-2 bg-red-600 text-white rounded-lg">Simpan</button></div></form></div>}
                </>
            );
        }

        function KeluhanManager({ data, pelanggan, showToast, isAdmin, currentUser }) {
            const wFilter = useWilayahFilter(pelanggan, isAdmin, currentUser);
            const [modal, setModal] = useState(false); const [editId, setEditId] = useState(null);
            const [form, setForm] = useState({ tanggal: getCurrentDateYMD(), idPelanggan: '', keluhan: '', status: 'Menunggu', keterangan: '' });
            const filteredData = data.filter(k => wFilter.isMatchWilayah((pelanggan.find(p=>p.id===k.idPelanggan)||{}).wilayah)).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));
            const simpan = async (e) => { e.preventDefault(); if(!form.idPelanggan) return; try { if(editId) await DB_PUSAT.collection('keluhan').doc(editId).update(form); else await DB_PUSAT.collection('keluhan').add(form); setModal(false); showToast('Tersimpan'); } catch(err){alert(err.message);} };
            const hapus = async (id) => { if(isAdmin && window.confirm('Hapus?')) { await DB_PUSAT.collection('keluhan').doc(id).delete(); showToast('Dihapus'); } };
            return (
                <>
                    <GenericTable title="Keluhan & Perbaikan" btnL="Tambah Keluhan" cols={['Tanggal','Pelapor','Isi Keluhan','Status','Aksi']} data={filteredData} onAdd={()=>{setEditId(null); setModal(true);}} rowRender={k=>{const p=pelanggan.find(x=>x.id===k.idPelanggan); return (<tr key={k.id}><td className="p-4">{k.tanggal}</td><td className="p-4 font-bold">{p?p.nama:'-'}</td><td className="p-4 text-red-600">{k.keluhan}</td><td className="p-4">{k.status}</td><td className="p-4 space-x-2"><button onClick={()=>{setEditId(k.id); setForm(k); setModal(true);}} className="text-blue-500"><i className="fas fa-edit"></i></button>{isAdmin && <button onClick={()=>hapus(k.id)} className="text-red-500"><i className="fas fa-trash"></i></button>}</td></tr>)}}/>
                    {modal && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"><form onSubmit={simpan} className="bg-white p-6 rounded-xl w-full max-w-md"><h3 className="font-bold text-xl mb-4">Laporan Keluhan</h3><div className="space-y-4 mb-6"><div><label className="text-xs">Pilih Warga</label><select value={form.idPelanggan} onChange={e=>setForm({...form, idPelanggan:e.target.value})} className="border p-2 w-full rounded" required><option value="">Pilih...</option>{pelanggan.filter(p=>wFilter.isMatchWilayah(p.wilayah)).map(p=><option key={p.id} value={p.id}>{p.nama}</option>)}</select></div><div><label className="text-xs">Keluhan</label><textarea value={form.keluhan} onChange={e=>setForm({...form, keluhan:e.target.value})} className="border p-2 w-full rounded" required/></div><div><label className="text-xs">Status</label><select value={form.status} onChange={e=>setForm({...form, status:e.target.value})} className="border p-2 w-full rounded"><option>Menunggu</option><option>Proses</option><option>Selesai</option></select></div></div><div className="flex justify-end gap-3"><button type="button" onClick={()=>setModal(false)} className="px-4 py-2 border rounded-lg">Batal</button><button type="submit" className="px-4 py-2 bg-orange-600 text-white rounded-lg">Simpan</button></div></form></div>}
                </>
            );
        }

        function PengaturanManager({ settings, adminUsers, showToast }) {
            const defPerms = { 'Admin': ['dashboard','pelanggan','tagihan','keluhan','pengeluaran','pelaporan','pengaturan'], 'Petugas': ['pelanggan','tagihan','keluhan'], 'Ketua HIPAB': ['dashboard','pelaporan'] };
            const [fs, setFs] = useState(settings); const [users, setUsers] = useState([]); const [perms, setPerms] = useState(defPerms); const [loaded, setLoaded] = useState(false);
            useEffect(() => { if (adminUsers?.length > 0 && !loaded) { setUsers(adminUsers); setLoaded(true); } }, [adminUsers, loaded]);
            useEffect(() => { if (settings) { setFs(settings); setPerms(settings.rolePermissions || defPerms); } }, [settings]);
            
            const handleTgl = (r, m) => { if(r==='Admin'&&m==='pengaturan')return; setPerms(p => ({...p, [r]: (p[r]||[]).includes(m) ? p[r].filter(x=>x!==m) : [...(p[r]||[]), m]})); };
            const simpanSemua = async (e) => { e.preventDefault(); if(users.some(u => !u.username.trim() || !u.password.trim())) return alert("Username/Password tidak boleh kosong!"); try { await DB_PUSAT.collection('pengaturan').doc('konfigurasi').set({...fs, tarif:Number(fs.tarif), beban:Number(fs.beban), batasBulanKritis:Number(fs.batasBulanKritis), batasNominalKritis:Number(fs.batasNominalKritis), rolePermissions: perms}); await DB_PUSAT.collection('pengaturan').doc('users').set({ list: users }); showToast("Disimpan!"); } catch(err) { alert(err.message); } };
            
            const Inp = ({ l, v, f, type="text" }) => (<div><label className="block text-sm font-medium text-gray-700 mb-1">{l}</label><input type={type} value={v||''} onChange={e=>setFs({...fs, [f]:e.target.value})} className="border p-2 w-full rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required/></div>);
            
            return (
                <div className="space-y-6 max-w-4xl">
                    <h2 className="text-2xl font-bold text-gray-800">Pengaturan</h2>
                    <form onSubmit={simpanSemua} className="bg-white p-6 rounded-xl border">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <Inp l="Nama Aplikasi" v={fs.appName} f="appName"/> <Inp l="Keterangan" v={fs.appSubtitle} f="appSubtitle"/>
                            <Inp l="Tarif (Rp)" v={fs.tarif} f="tarif" type="number"/> <Inp l="Beban (Rp)" v={fs.beban} f="beban" type="number"/>
                            <Inp l="Batas Bulan Kritis" v={fs.batasBulanKritis} f="batasBulanKritis" type="number"/> <Inp l="Batas Nominal Kritis" v={fs.batasNominalKritis} f="batasNominalKritis" type="number"/>
                        </div>
                    </form>
                    <div className="bg-white p-6 rounded-xl border overflow-x-auto">
                        <h3 className="font-bold mb-4">Hak Akses</h3>
                        <table className="w-full text-sm text-center border">
                            <thead className="bg-gray-50 border-b"><tr><th>Role</th>{['dashboard','pelanggan','tagihan','keluhan','pengeluaran','pelaporan','pengaturan'].map(m=><th key={m} className="p-2">{m}</th>)}</tr></thead>
                            <tbody>{['Admin','Petugas','Ketua HIPAB'].map(r => (<tr key={r} className="border-b"><td className="p-2 font-bold">{r}</td>{['dashboard','pelanggan','tagihan','keluhan','pengeluaran','pelaporan','pengaturan'].map(m=><td key={m}><input type="checkbox" checked={(perms[r]||[]).includes(m)} onChange={()=>handleTgl(r,m)} disabled={r==='Admin'&&m==='pengaturan'}/></td>)}</tr>))}</tbody>
                        </table>
                    </div>
                    <div className="bg-white p-6 rounded-xl border">
                        <div className="flex justify-between mb-4"><h3 className="font-bold">Akun Login</h3><button onClick={()=>setUsers([...users, {id:Date.now().toString(), username:'', password:'', role:'Petugas'}])} className="bg-gray-100 px-3 py-1 rounded">Tambah User</button></div>
                        <div className="space-y-2 mb-4">{users.map((u, i) => (<div key={u.id} className="flex gap-2"><input value={u.username} onChange={e=>setUsers(users.map(x=>x.id===u.id?{...x, username:e.target.value}:x))} className="border p-2 rounded w-1/4"/><input value={u.password} onChange={e=>setUsers(users.map(x=>x.id===u.id?{...x, password:e.target.value}:x))} className="border p-2 rounded w-1/4"/><select value={u.role} onChange={e=>setUsers(users.map(x=>x.id===u.id?{...x, role:e.target.value}:x))} className="border p-2 rounded w-1/4"><option>Admin</option><option>Petugas</option><option>Ketua HIPAB</option></select><input value={u.wilayah||''} onChange={e=>setUsers(users.map(x=>x.id===u.id?{...x, wilayah:e.target.value}:x))} placeholder="Wilayah" className="border p-2 rounded flex-1"/><button onClick={()=>setUsers(users.filter(x=>x.id!==u.id))} className="text-red-500 p-2"><i className="fas fa-trash"></i></button></div>))}</div>
                        <button onClick={simpanSemua} disabled={!loaded} className="bg-blue-600 text-white px-6 py-2 rounded-lg w-full font-bold">{loaded ? 'Simpan Seluruh Pengaturan' : 'Memuat...'}</button>
                    </div>
                </div>
            );
        }

        function Pelaporan({ pelanggan, tagihan, pengeluaran, settings }) {
            const [reportType, setReportType] = useState('bulanan');
            const [filterPeriode, setFilterPeriode] = useState(getCurrentDateYMD().slice(0, 7));
            const [filterWilayah, setFilterWilayah] = useState('Semua');

            const filPel = pelanggan.filter(p => filterWilayah === 'Semua' || p.wilayah === filterWilayah);
            const pelIds = new Set(filPel.map(p => p.id));
            const getName = id => pelanggan.find(p => p.id === id)?.nama || '-';

            const dwnCsv = () => {
                const c = "Nama;Periode;Tagihan;Dibayar;Sisa;Petugas\n" + tagihan.filter(t=>pelIds.has(t.idPelanggan)).map(t=>`"${getName(t.idPelanggan)}";"${t.periode}";${t.total};${getTerbayar(t)};${getSisa(t)};"${t.petugasPenagih||''}"`).join('\n');
                const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(["\ufeff", c])); a.download = "Backup.csv"; a.click();
            };

            const thH = (title) => `<div class="header"><h2>${settings.appName}</h2>${settings.appSubtitle?`<h4>${settings.appSubtitle}</h4>`:''}<h3>${title} ${filterWilayah!=='Semua'?`(${filterWilayah})`:''}</h3></div>`;
            const tbl = (h, r, e) => `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.join(''):`<tr><td colspan="99" class="text-center">${e}</td></tr>`}</tbody></table>`;

            let htm = "";
            if (reportType === 'bulanan') {
                const tg = tagihan.filter(t => t.periode === filterPeriode && pelIds.has(t.idPelanggan));
                htm = thH('Laporan Bulanan') + `<p>Pemasukan: <b>${formatRp(tg.reduce((s,t)=>s+getTerbayar(t),0))}</b></p>` + tbl(['Nama','Tagihan','Dibayar','Sisa','Petugas'], tg.map(t=>`<tr><td>${getName(t.idPelanggan)}</td><td class="text-right">${formatRp(t.total)}</td><td class="text-right">${formatRp(getTerbayar(t))}</td><td class="text-right">${formatRp(getSisa(t))}</td><td class="text-center">${t.petugasPenagih||'-'}</td></tr>`), 'Kosong');
            } else {
                const ut = tagihan.filter(t => getSisa(t) > 0 && pelIds.has(t.idPelanggan));
                htm = thH('Laporan Tunggakan') + tbl(['Nama','Periode','Tagihan','Dibayar','Tunggakan'], ut.map(t=>`<tr><td>${getName(t.idPelanggan)}</td><td>${t.periode}</td><td class="text-right">${formatRp(t.total)}</td><td class="text-right">${formatRp(getTerbayar(t))}</td><td class="text-right text-red-600 font-bold">${formatRp(getSisa(t))}</td></tr>`), 'Tidak ada tunggakan');
            }

            return (
                <div className="space-y-4">
                    <div className="bg-white p-5 rounded-xl border flex flex-wrap gap-4 items-end">
                        <select value={filterWilayah} onChange={e=>setFilterWilayah(e.target.value)} className="border p-2 rounded"><option value="Semua">Semua Wilayah</option>{[...new Set(pelanggan.map(p=>p.wilayah).filter(Boolean))].map(w=><option key={w}>{w}</option>)}</select>
                        <select value={reportType} onChange={e=>setReportType(e.target.value)} className="border p-2 rounded"><option value="bulanan">Bulanan</option><option value="tunggakan">Tunggakan</option></select>
                        {reportType==='bulanan' && <input type="month" value={filterPeriode} onChange={e=>setFilterPeriode(e.target.value)} className="border p-2 rounded"/>}
                        <div className="flex gap-2 ml-auto"><button onClick={dwnCsv} className="bg-indigo-600 text-white px-4 py-2 rounded">Backup Excel</button><button onClick={()=>printContent(htm, 'a4')} className="bg-green-600 text-white px-4 py-2 rounded">Cetak PDF</button></div>
                    </div>
                    <div className="bg-white p-8 rounded-xl border overflow-x-auto"><div dangerouslySetInnerHTML={{ __html: htm }} /></div>
                </div>
            );
        }

        function App() {
            const [fUser, setFUser] = useState(null);
            const [cUser, setCUser] = useState(() => { const s = localStorage.getItem('hipab_user'); return s ? JSON.parse(s) : null; });
            const [tab, setTab] = useState('dashboard'); const [mob, setMob] = useState(false); const [toast, setToast] = useState(null);
            
            const [pel, setPel] = useState([]); const [tag, setTag] = useState([]); const [peng, setPeng] = useState([]); const [kel, setKel] = useState([]); const [adm, setAdm] = useState([]);
            const defPerm = { 'Admin': ['dashboard','pelanggan','tagihan','keluhan','pengeluaran','pelaporan','pengaturan'], 'Petugas': ['pelanggan','tagihan','keluhan'], 'Ketua HIPAB': ['dashboard','pelaporan'] };
            const [set, setSet] = useState({ appName: 'BUMDES SRIKOYO', appSubtitle: 'UNIT HIPAB', tarif: 1500, beban: 2000, batasBulanKritis: 3, batasNominalKritis: 350000, rolePermissions: defPerm });

            useEffect(() => { auth.signInAnonymously().catch(console.error); const un = auth.onAuthStateChanged(setFUser); return un; }, []);
            useEffect(() => {
                if (!fUser) return;
                const uns = [
                    DB_PUSAT.collection('pengaturan').doc('konfigurasi').onSnapshot(d => d.exists ? setSet(d.data()) : DB_PUSAT.collection('pengaturan').doc('konfigurasi').set(set)),
                    DB_PUSAT.collection('pengaturan').doc('users').onSnapshot(d => d.exists ? setAdm(d.data().list || []) : DB_PUSAT.collection('pengaturan').doc('users').set({ list: [{ id: '1', username: 'admin', password: '123', role: 'Admin', wilayah: '' }] })),
                ];
                if (!cUser) return () => uns.forEach(u=>u());
                uns.push(
                    DB_PUSAT.collection('pelanggan').onSnapshot(s => setPel(s.docs.map(d => ({ id: d.id, ...d.data() })))),
                    DB_PUSAT.collection('tagihan').onSnapshot(s => setTag(s.docs.map(d => ({ id: d.id, ...d.data() })))),
                    DB_PUSAT.collection('pengeluaran').onSnapshot(s => setPeng(s.docs.map(d => ({ id: d.id, ...d.data() })))),
                    DB_PUSAT.collection('keluhan').onSnapshot(s => setKel(s.docs.map(d => ({ id: d.id, ...d.data() }))))
                );
                return () => uns.forEach(u=>u());
            }, [cUser, fUser]);

            const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 3000); };
            const handleLogout = () => { localStorage.removeItem('hipab_user'); setCUser(null); setTab('dashboard'); };

            if (!fUser) return <div className="flex h-[100dvh] items-center justify-center bg-blue-900 text-white"><i className="fas fa-spin fa-circle-notch text-5xl"></i></div>;
            if (!cUser) return <LoginScreen users={adm} settings={set} onLogin={(u) => { localStorage.setItem('hipab_user', JSON.stringify(u)); setCUser(u); setTab((set.rolePermissions||defPerm)[u.role]?.[0] || 'dashboard'); }} showToast={showToast} />;

            const isAdmin = cUser.role === 'Admin';
            const hasAcc = (mId) => (set.rolePermissions || defPerm)[cUser.role || 'Petugas']?.includes(mId);

            const MENU = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-home', ao: false }, { id: 'pelanggan', label: 'Pelanggan', icon: 'fa-users', ao: false },
                { id: 'tagihan', label: 'Tagihan', icon: 'fa-file-invoice-dollar', ao: false }, { id: 'keluhan', label: 'Keluhan', icon: 'fa-tools', ao: false },
                { id: 'pengeluaran', label: 'Buku Kas', icon: 'fa-book', ao: true }, { id: 'pelaporan', label: 'Pelaporan', icon: 'fa-chart-pie', ao: true },
                { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-cog', ao: true }
            ];

            const SidebarCont = () => (
                <>
                    <div className="flex flex-col items-center py-6 border-b border-blue-800">
                        <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-3 p-2 text-blue-600"><LogoRenderer logo={set.logo} clName="text-3xl" /></div>
                        <h1 className="text-lg font-bold text-center leading-tight">{set.appName}</h1><p className="text-sm text-blue-200">{set.appSubtitle}</p>
                        <span className="mt-2 bg-blue-800 px-3 py-1 rounded-full text-xs">Login: {cUser.username}</span>
                    </div>
                    <nav className="flex-1 px-4 py-4 space-y-2 overflow-y-auto">
                        {MENU.map(m => (!m.ao || isAdmin) && hasAcc(m.id) && <NavItem key={m.id} icon={m.icon} label={m.label} active={tab===m.id} onClick={()=>{setTab(m.id); setMob(false);}} />)}
                    </nav>
                    <div className="p-4"><button onClick={handleLogout} className="w-full py-2 bg-red-600 text-white rounded"><i className="fas fa-sign-out-alt mr-2"></i> Keluar</button></div>
                </>
            );

            return (
                <div className="flex h-[100dvh] overflow-hidden bg-gray-50">
                    {toast && <div className="fixed top-4 right-4 z-[100] bg-green-600 text-white px-5 py-3 rounded-lg shadow-lg flex items-center animate-bounce"><i className="fas fa-check-circle mr-2"></i> {toast}</div>}
                    <aside className="hidden md:flex flex-col w-64 bg-blue-900 text-white h-full shadow-xl z-20"><SidebarCont /></aside>
                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        <header className="md:hidden flex items-center justify-between bg-blue-900 text-white p-4"><button onClick={()=>setMob(true)}><i className="fas fa-bars text-xl"></i></button><div className="font-bold">{set.appName}</div><div className="w-6"></div></header>
                        {mob && <div className="md:hidden fixed inset-0 z-50 flex"><div className="bg-blue-900 w-64 flex flex-col text-white"><div className="p-4 flex justify-end"><button onClick={()=>setMob(false)}><i className="fas fa-times text-xl"></i></button></div><SidebarCont /></div><div className="flex-1 bg-black/50" onClick={()=>setMob(false)}></div></div>}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {tab === 'dashboard' && hasAcc('dashboard') && <Dashboard pelanggan={pel} tagihan={tag} pengeluaran={peng} keluhan={kel} isAdmin={isAdmin} currentUser={cUser} settings={set} />}
                            {tab === 'pelanggan' && hasAcc('pelanggan') && <PelangganManager data={pel} showToast={showToast} isAdmin={isAdmin} currentUser={cUser} />}
                            {tab === 'tagihan' && hasAcc('tagihan') && <TagihanManager pelanggan={pel} tagihan={tag} settings={set} showToast={showToast} isAdmin={isAdmin} currentUser={cUser} />}
                            {tab === 'keluhan' && hasAcc('keluhan') && <KeluhanManager data={kel} pelanggan={pel} showToast={showToast} isAdmin={isAdmin} currentUser={cUser} />}
                            {tab === 'pengeluaran' && hasAcc('pengeluaran') && <PengeluaranManager data={peng} showToast={showToast} />}
                            {tab === 'pelaporan' && hasAcc('pelaporan') && <Pelaporan pelanggan={pel} tagihan={tag} pengeluaran={peng} settings={set} />}
                            {tab === 'pengaturan' && hasAcc('pengaturan') && <PengaturanManager settings={set} adminUsers={adm} showToast={showToast} />}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
